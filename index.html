<script>
const POSTS = [{"slug": "2026-10-21-ba-alawi-sada-part-4-ii-the-founding-of-the-tariqah-al-faqih-al-muqaddam-574-653h", "title": "The Bā ʿAlawī Sāda: A Comprehensive History, Methodology, and Legacy (Part 4: II. The Founding of the Ṭarīqah: al-Faqīh al-Muqaddam (574–653H))", "date": "2026-10-14", "time": "20:22", "summary": "Six generations after Aḥmad al-Muhājir رحمه الله, in Tarīm, was born the figure both al-Manhaj al-Sawī and ʿIqd al-Yawāqīt identify as the effective founder of the Bā ʿAlawī ṭarī", "rtl": false, "minutes": 22, "html": "<h3>II. The Founding of the Ṭarīqah: al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (574–653H)<\/h3>\n<p>Six generations after Aḥmad al-Muhājir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>, in Tarīm, was born the figure both <em>al-Manhaj al-Sawī<\/em> and <em>ʿIqd al-Yawāqīt<\/em> identify as the effective founder of the Bā ʿAlawī ṭarīqah as a distinct, formalised spiritual path: <strong>al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>, Jamāl al-Dīn Muḥammad ibn ʿAlī Bā ʿAlawī al-Ḥaḍramī al-Ḥusaynī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong> (b. 574H, d. 653H). <em>ʿIqd al-Yawāqīt<\/em> (Vol. 1, p. 204) opens his entry with a formal title that itself states the tradition's founding claim precisely:<\/p>\n<blockquote lang=\"ar\" dir=\"rtl\"><p>قطبها ومدار حقيقتها، قطب الأقطاب المتمكنين، ونقوة جوهر الأولياء العارفين، شيخ الشيوخ المحققين، الفرد الغوث إمام الأكابر، وكنز الذخائر، الفقيه، المقدَّم، جمال الدين، محمد بن علي باعلوي الحضرمي الحسيني<\/p><\/blockquote>\n<p><strong>\"[The ṭarīqah's] pole and the axis of its reality... al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>, Jamāl al-Dīn, Muḥammad ibn ʿAlī Bā ʿAlawī, of Ḥaḍramī and Ḥusaynid descent.\"<\/strong><\/p>\n<p>He is elsewhere described in the same source (p. 204) as <em>\"muqaddamu hādhihi al-ṭāʾifati wa raʾsu ṭarīqihim wa ḥāmilu liwāʾi jayshihim, wa ʿalā yadayhi basaqat aghṣānuhā wa aynaʿat thimāruhā\"<\/em> — \"the leader of this group, the head of their path, bearer of the banner of their company, at whose hands its branches spread and its fruits ripened.\"<\/p>\n<p>His significance rests on a specific, documented historical claim: that before him, the people of Ḥaḍramawt possessed rigorous fiqh and ḥadīth scholarship but had no organised, orthodox school of taṣawwuf — and that he is the one who introduced it, on sound Sunni foundations. <em>Al-Mashraʿ al-Rawī<\/em>, as preserved in <em>ʿIqd al-Yawāqīt<\/em> (Vol. 1, p. 215), states this explicitly:<\/p>\n<blockquote lang=\"ar\" dir=\"rtl\"><p>وكان أهل حضرموت مشتغلين بالعلوم الفقهية، وجمع الأحاديث النبوية، فلم يكن فيهم من يعرف طريق الصوفية، ولا من يكشف اصطلاحاتهم السَّنّية، فأظهر الأستاذ علومها، ونشر في تلك النواحي أعلامها<\/p><\/blockquote>\n<p><strong>\"The people of Ḥaḍramawt were occupied with the fiqh sciences and the collecting of prophetic ḥadīths, and there was no one among them who knew the Sufi path, nor anyone who could disclose its Sunni technical vocabulary, until the Teacher [al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>] manifested its sciences and spread its banners in those regions.\"<\/strong><\/p>\n<p>His own spiritual formation is described, in the same source, as reaching — across a great geographic distance, without a direct personal meeting — the celebrated North African master <strong>Shaykh Abū Madyan Shuʿayb al-Maghribī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong> (\"al-Ghawth al-Maghribī\"), via companions of that Shaykh who had travelled to Makkah (<em>al-Manhaj al-Sawī<\/em>, p. 22; <em>ʿIqd al-Yawāqīt<\/em>, Vol. 1, p. 230). This detail matters: the Bā ʿAlawī ṭarīqah is not a self-generated, freestanding movement invented in isolation, but a documented branch of the same mainstream trans-regional Sufi transmission — running through Abū Madyan <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> — that also produced the Shādhilī order.<\/p>\n<p><strong>A separate, formal fiqh-transmission chain, independent of the Sufi khirqah above — from a dedicated modern academic history of Ḥaḍramī Shāfiʿī fiqh<\/strong> (<em>Juhūd Fuqahāʾ Ḥaḍramawt fī Khidmat al-Madhhab al-Shāfiʿī<\/em>, entry 35, pp. 718–720). This source gives al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s formal credentials as a jurist, independent of his later Sufi reputation:<\/p>\n<blockquote lang=\"ar\" dir=\"rtl\"><p>وسند تفقهه في المذهب الشافعي: عن الشيخ علي بامروان، عن الإمام القلعي، عن أبي الفتوح ابن أبي عقامة، عن أبي الغنائم الفارقي، عن أبي إسحاق الشيرازي، إلى آخر السند<\/p><\/blockquote>\n<p><strong>\"His chain of formal training in the Shāfiʿī madhhab [runs]: from Shaykh ʿAlī Bāmarwān, from Imam al-Qalʿī, from Abū al-Futūḥ ibn Abī ʿAqāmah, from Abū al-Ghanāʾim al-Fāriqī, from Abū Isḥāq al-Shīrāzī\" —<\/strong> the celebrated classical Shāfiʿī authority (d. 476H) whose own works remain standard references in the school to this day. A full, independently-sourced roster of teachers and students accompanies this chain: among his teachers, his own father ʿAlī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (d. after 590H), Sālim ibn Baṣrī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (d. 604H), ʿAlī Bāmarwān <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (d. 624H), ʿAbdullāh Bāʿubayd <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (d. 611H), and Aḥmad Bāʿīsā <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (d. 628H) — the same roster already given above from <em>Adwār al-Tārīkh al-Ḥaḍramī<\/em>, now independently corroborated; among his students, Saʿīd ibn ʿĪsā al-ʿAmūdī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (d. 670H, already named above), ʿAbdullāh al-Qadīm ibn Muḥammad Bāʿabbād <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (d. 687H), his own five sons, and two grandsons, each with a death date. His death notice gives the same 653H date already established above, independently confirmed via a chronogram (<em>ḥisāb al-jummal<\/em>) encoded in the phrase <strong>\"ab Tarīm\"<\/strong> (أب تريم). The same academic source also investigates, with explicit methodological caution, a claim that he answered \"three hundred questions\" in a formal fatwā collection — tracing it through four classical biographers (al-Jandī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>, al-Ahdal <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>, al-Khirid <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>, al-Shillī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>) and concluding the sources are genuinely ambiguous about whether this was a fiqh-fatwā collection or a Sufi-themed correspondence, rather than asserting either reading as settled — a model of exactly the \"cite precisely, flag what remains uncertain\" standard this document has tried to apply throughout.<\/p>\n<p><strong>The fuller transmission narrative, with named intermediaries.<\/strong> Al-Shāṭirī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s own <em>Adwār al-Tārīkh al-Ḥaḍramī<\/em> (Vol. 2, pp. 134–136) names the actual chain of messengers: Abū Madyan <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> sent his disciple <strong>Shaykh ʿAbd al-Raḥmān al-Muqʿad<\/strong> to carry the path to Ḥaḍramawt; al-Muqʿad <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> died in Makkah before completing the journey and bequeathed the mission to <strong>Shaykh ʿAbdullāh al-Maghribī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong>, who carried it onward and invested <em>both<\/em> al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> at Tarīm <em>and<\/em>, separately, his close companion <strong>Shaykh Saʿīd ibn ʿĪsā al-ʿAmūdī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong> at Qaydūn — corroborating, from the same source, the dual investiture already documented above via the bequest anecdote. The same source names the specific disciple angered by al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s turn toward Sufism while he was still formally leading a fiqh study-circle: <strong>Shaykh ʿAlī Bāmarwān <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong>, a named, historically situated witness rather than an anonymous tradition. Al-Shāṭirī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> adds his own candid, self-critical observation, as a modern historian writing about his own tradition: that some of the family's major Sufi figures — including Abū Bakr ibn Sālim <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> and al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> himself — were at times attributed ecstatic utterances (<em>shaṭḥ<\/em>) comparable to those of al-Ḥallāj <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> or al-Suhrawardī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>, which he states is \"safer and more prudent\" to explain charitably, as spoken in states of spiritual absorption, than to treat as grounds for accusation — and that later generations of the tradition show a documented decline in scholarly depth compared to earlier ones, with some adherents favouring showy devotion over the religious sciences. This is a modern Ḥaḍramī historian's own internal self-criticism, offered here as evidence of the tradition's capacity for honest self-assessment, not as an admission used against it.<\/p>\n<p><strong>A fuller, independently-sourced account of al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s own investiture moment itself<\/strong>, from <em>Sīrat al-Salaf min Banī ʿAlawī al-Ḥusayniyyīn<\/em> (p. 26): the disciple sent to invest him deliberately provoked him while he was still armed, in the ordinary tribal manner of his age, as a test — and only once al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> set the weapon aside in response did the disciple clothe him in the Sufi garb. A separate account, from al-Ḥaddād <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s own recorded teaching sessions (<em>Tathbīt al-Fuʾād<\/em>, Vol. 3, p. 49), adds the detail that al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>, upon receiving the khirqah from Abū Madyan <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s line, physically <strong>broke his sword and buried it in the earth<\/strong>, saying twice, <em>\"al-faqru khayr\"<\/em> (\"poverty is better\") — a vivid, concrete enactment of the \"breaking of the sword\" tradition already documented above from <em>ʿIqd al-Yawāqīt<\/em>.<\/p>\n<p><strong>His formal fiqh credentials, independent of the Sufi chain.<\/strong> A dedicated academic history of Ḥaḍramī Shāfiʿī jurisprudence, <em>Juhūd Fuqahāʾ Ḥaḍramawt fī Khidmat al-Madhhab al-Shāfiʿī<\/em> (pp. 718–720, entry 35), documents al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s own formal fiqh transmission chain, distinct from and prior to his Sufi investiture: <strong>Muḥammad ibn ʿAlī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> ← ʿAlī Bāmarwān <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> ← Imam al-Qalʿī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> ← Abū al-Futūḥ ibn Abī ʿAqāmah <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> ← Abū al-Ghanāʾim al-Fāriqī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> ← Abū Isḥāq al-Shīrāzī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong> — the celebrated classical Shāfiʿī authority and author of <em>al-Muhadhdhab<\/em>. The same source gives his full named teacher roster with death dates — his father ʿAlī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (d. after 590H), Sālim ibn Baṣrī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (d. 604H), ʿAlī Bāmarwān <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (d. 624H), ʿAbdullāh Bāʿubayd <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (d. 611H), Aḥmad Bāʿīsā <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (d. 628H), with a brief childhood meeting, \"for blessing,\" with Sālim Bāfaḍl <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (d. 581H) — and his student roster with death dates, including Saʿīd ibn ʿĪsā al-ʿAmūdī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (d. 670H) and ʿAbdullāh al-Qadīm ibn Muḥammad Bāʿabbād <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (d. 687H), his five named sons, and two grandsons. The same academic source independently corroborates his 653H death date via a separate chronogram (the phrase <em>\"ab Tarīm\"<\/em>, encoding 653 by abjad numerology), and records the classical historians al-Jandī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> and al-Ahdal <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s own joint verdict: <strong>\"he is the first of the Bā ʿAlawī house to take up taṣawwuf, since before him they were known [only] for fiqh and noble lineage\"<\/strong> — direct, independent corroboration of this document's own account of his role as the one who introduced organised taṣawwuf into a family previously defined purely by fiqh and lineage. The same academic study also models the honest-flagging standard this document itself follows: it investigates, and explicitly leaves unresolved rather than asserts, whether a claim that al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> answered \"three hundred questions\" in a formal collection refers to a fiqh-fatwā compilation or a Sufi-themed correspondence, after tracing the claim through four classical sources without finding a definitive answer.<\/p>\n<p>Imam ʿAbd al-Raḥmān Bilfaqīh <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (d. 1162H), \"ʿAllāmat al-Dunyā,\" gives the classical one-line summary of this lineage:<\/p>\n<blockquote lang=\"ar\" dir=\"rtl\"><p>أصل طريق السادة آل باعلوي، طريق الشيخ أبي مدين المغربي، وطَوَّرها ومدار حقيقتها الفرد الغوث الفقيه الإمام محمد بن علي باعلوي الحضرمي، تلقاها عن الرجال وتوارثها الأكابر عنه الرجال والمقامات والأحوال<\/p><\/blockquote>\n<p><strong>\"The origin of the Way of the Sādah Āl Bā ʿAlawī is the Way of Shaykh Abū Madyan al-Maghribī, and its development and the axis of its reality is the unique al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>, Imam Muḥammad ibn ʿAlī Bā ʿAlawī al-Ḥaḍramī, who received it from [spiritual] men, and the great ones inherited from him the men, the [spiritual] stations, and the states.\"<\/strong> (<em>ʿIqd al-Yawāqīt<\/em>, Vol. 1, p. 22, and <em>al-Manhaj al-Sawī<\/em>, p. 22)<\/p>\n<p><strong>His worship and asceticism.<\/strong> <em>ʿIqd al-Yawāqīt<\/em> (Vol. 1, p. 215) describes his devotional life in the most emphatic terms the classical biographical idiom allows: <em>\"kāna taḥaqququhu bi'l-taḥqīqi wa'l-tadqīqi maqrūnan bi'l-tafrīdi wa'l-tajrīd... wa kānat ʿibādatuhu baḥran bilā sāḥil\"<\/em> — his verification and precision [in learning] were joined with spiritual singling-out and detachment, and \"his worship was a sea without shore.\" By day he engaged in study and fasting; in the pre-dawn hours he stood in prayer; and he recited the Qur'ān constantly, completing it and immediately beginning another recitation. The same source records that he would see the Gardens of Paradise open before him, and would see the world's transience \"between his two eyes,\" and so cast worldly attachment aside with the disdain of a wise, forbearing man.<\/p>\n<p><strong>His deliberate concealment of his own spiritual states.<\/strong> Consistent with the humility this document documents throughout the tradition as a whole (Section VIII below), al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> is recorded as having actively hidden whatever extraordinary states he attained:<\/p>\n<blockquote lang=\"ar\" dir=\"rtl\"><p>كان متحققاً بصفة الفقر والمسكنة والانكسار، والغيبة عن شهود الآثار، فلذلك لم تظهر منه كثير من الكرامات وخوارق العادات<\/p><\/blockquote>\n<p><strong>\"He was realized in the qualities of poverty, humbleness, self-effacement, and absence from witnessing [worldly] effects — therefore few of his miracles and extraordinary happenings became manifest [i.e., he deliberately concealed them].\"<\/strong> (<em>ʿIqd al-Yawāqīt<\/em>, Vol. 1, p. 216)<\/p>\n<p>Two further, historically load-bearing facts about al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> are worth setting out at length, because they bear directly on any insinuation that veneration of the Bā ʿAlawī sāda is a matter of tribal privilege rather than earned sanctity.<\/p>\n<p><strong>First, the \"breaking of the sword.\"<\/strong> <em>ʿIqd al-Yawāqīt<\/em> (Vol. 1, p. 222) preserves a saying, attributed within the tradition itself, naming the two men to whom the family owes its greatest debt — and the nature of that debt is telling:<\/p>\n<blockquote lang=\"ar\" dir=\"rtl\"><p>اثنان لهما أكبر منّة على آل أبي علوي: الشيخ أحمد بن عيسى: خرج بهم من البدع والفتن، والفقيه المقدَّم: سلّمهم من حمل السلاح والعمومية بكسر السلاح لما تفقّر<\/p><\/blockquote>\n<p><strong>\"Two men have the greatest favor upon Āl Abī ʿAlawī: Shaykh Aḥmad ibn ʿĪsā, who brought them out from heretical innovations and strife; and al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>, who delivered them from carrying weapons and from tribal blood-feud custom, by breaking the sword when he renounced worldly and martial life.\"<\/strong><\/p>\n<p>This is the textual basis for what Bā ʿAlawī historiography records as a deliberate civilizational pivot: al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> personally renounced armed, tribal life and converted the family's vocation from a martial one to a purely scholarly and spiritual one.<\/p>\n<p><strong>Second, the three supplications, and the tradition's own explanation for its centuries of sustained good repute.<\/strong> <em>ʿIqd al-Yawāqīt<\/em> (Vol. 1, p. 216) records:<\/p>\n<blockquote lang=\"ar\" dir=\"rtl\"><p>ودعا لذريته بثلاث دعوات: الأولى: حسن السيرة. الثانية: أن لا يسلّط الله عليهم ظالماً يؤذيهم. الثالثة: أن لا يموت أحد منهم إلا وهو مستور. وقد استجاب الله منه الدعاء، وأجراه على سنن الوفاء، فآثاره مستمرة ظاهرة في هذه السلالة الطاهرة، وأنواره عليهم لائحة باهرة<\/p><\/blockquote>\n<p><strong>\"He prayed three prayers for his progeny: first, good conduct; second, that Allah never let an oppressive tyrant dominate and harm them; third, that none of them should die except in a concealed, dignified state. And Allah answered his supplication and made it run true — its effects remain manifest and clear in this pure lineage, and its lights are a radiant brightness upon them.\"<\/strong><\/p>\n<p>The tradition, in short, does not present its sanctity as an automatic entitlement of blood. It presents it — in its own primary sources — as the answered supplication of a scholar who had already renounced worldly power, made contingent on \"good conduct,\" and it repeatedly and explicitly warns its own members against relying on lineage in place of piety, as the direct quotations in Section VIII below make clear.<\/p>\n<p><strong>A dream that protected the town.<\/strong> <em>ʿIqd al-Yawāqīt<\/em> (Vol. 1, p. 221) preserves an anecdote illustrating both al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s posthumous standing and the tradition's own resistance to outside spiritual authority claimed on grounds other than sound character: a certain Shaykh Barkūwah came to Tarīm intending to exercise spiritual authority (<em>taḥkīm<\/em>) over the sāda in his own manner, but is recorded as having seen al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> in a dream, saying to him: اخرج من البلد لئلا تُفتن أولادي بحُسن خُلقك<\/p>\n<p><strong>\"Leave the town, lest my children be tempted by your good character\"<\/strong> — whereupon he departed. The same source preserves the saying that grew out of this and similar episodes, still current in Tarīm: تريم ما فيها إلا الله ورسوله والفقيه المقدَّم<\/p>\n<p><strong>\"Tarīm has nothing in it but Allah, His Messenger, and al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>.\"<\/strong><\/p>\n<p><strong>The move from concealment to written scholarship.<\/strong> <em>Al-Manhaj al-Sawī<\/em> (p. 22) and <em>ʿIqd al-Yawāqīt<\/em> (Vol. 1, pp. 231–232) agree that the generation immediately following al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> deliberately kept the ṭarīqah's teaching oral and unwritten<\/p>\n<p>until the ṭarīqah had spread far enough that distant students needed a textual record. The classical sources name the specific authors and their specific books: <strong>Shaykh ʿAbdullāh al-ʿAydarūs al-Akbar <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong> (d. 914H) composed <strong><em>al-Kibrīt al-Aḥmar<\/strong><\/em> (reportedly before the age of twenty); his own son, <strong>Imam Abū Bakr al-ʿAdanī al-ʿAydarūs <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong> (d. 914H; see Section III below), authored <strong><em>al-Juzʾ al-Laṭīf<\/strong><\/em>; and <strong>Shaykh ʿAlī ibn Abī Bakr al-Sakrān <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong>, al-ʿAydarūs al-Akbar <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s own brother, authored both <strong><em>al-Maʿārij al-Arwāḥ<\/strong><\/em> and its sequel <strong><em>al-Burqah al-Mashīqah<\/strong><\/em> — the four foundational texts that first set the ṭarīqah's oral teaching down in writing.<\/p>\n<p lang=\"ar\" dir=\"rtl\"><strong>\"I have not heard speech stronger than his.\"<\/strong> <em>Al-Burqah al-Mashīqah<\/em> itself preserves the single strongest contemporary endorsement of al-Faqīh al-Muqaddam رحمه الله found anywhere in the primary literature surveyed for this document, attributed to <strong>Shaykh al-Quṭb Wajīh al-Dīn ʿAbd al-Raḥmān ibn ʿAlī رحمه الله<\/strong>: ما رأيت أو ما سمعت أقوى من كلام الفقيه الشيخ جمال الدين محمد بن علي... ما نفضل أحداً على الفقيه من الأولياء إلا أن يكون من الصحابة أو ممن ورد في فضله نص صحيح نبوي مثل أويس القرني وغيره<\/p>\n<p><strong>\"I have not seen nor heard speech stronger than that of al-Faqīh, Shaykh Jamāl al-Dīn Muḥammad ibn ʿAlī... We give precedence over al-Faqīh to none among the saints, except one who was a Companion, or one whose merit is established by a sound prophetic text, like Uways al-Qaranī.\"<\/strong> Elsewhere in the same source this is intensified further still: ما لقيت أقوى من كلام الفقيه محمد بن علي إلا أن يكون كلام الأنبياء <span class=\"hon\" lang=\"ar\" dir=\"rtl\">عليهم السلام<\/span><\/p>\n<p><strong>\"I have found nothing stronger than al-Faqīh Muḥammad ibn ʿAlī's speech, except it would be the speech of the prophets.\"<\/strong><\/p>\n<p><strong>The khirqah and its chain to the Prophet <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صلى الله عليه وسلم<\/span>.<\/strong> The same source preserves, in full liturgical detail, the ceremony by which the ṭarīqah's Sufi cloak (<em>khirqah<\/em>) was — and still is — formally bestowed, together with the isnād chains by which al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> himself received it. The khirqah is explicitly theorised not as a mere garment but as سلسلة النسب المعنوي الديني المحمدي<\/p>\n<p>\"a chain of spiritual-religious Muḥammadan lineage\" — grounded in the Prophetic report كل سبب ونسب منقطع إلا سببي ونسبي<\/p>\n<p><strong>\"Every [worldly] bond and lineage is severed [at death], except my bond and my lineage.\"<\/strong> Two categories are distinguished: <strong>khirqat irādah<\/strong>, reserved for those of intense spiritual discipline, and <strong>khirqat tabarruk<\/strong>, the \"cloak of blessing-seeking,\" more widely transmitted to ordinary disciples and lovers of the path, whose recipient is required only to hold good opinion of the masters of the Way and not to judge their teaching deficient. The investiture ceremony (<em>tahkīm<\/em>) itself survives verbatim: the shaykh recites Qur'ān 3:102–103 and the Qur'ānic verses on the Pledge of Riḍwān (48:10, 48:18), asks the aspirant three times <em>\"raḍīta bī shaykhan?\"<\/em> (\"Are you satisfied with me as a shaykh?\"), to which the aspirant answers <em>\"raḍītu\"<\/em> (\"I am satisfied\") three times, and the shaykh replies <em>\"wa anā raḍītu laka\"<\/em> (\"And I am satisfied with you\") — a fuller version of the pledge adds the aspirant's own declaration: اخترت الفقر على الغنى، والذل على العز، واخترت الله تعالى على كل شيء<\/p>\n<p><strong>\"I have chosen poverty over wealth, and lowliness over might, and I have chosen Allah Most High over everything.\"<\/strong> Al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s own khirqah is traced through two independent chains: one through al-Ḥasan al-Baṣrī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> and ʿAlī ibn Abī Ṭālib <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنه<\/span> to the Prophet <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صلى الله عليه وسلم<\/span>, and a second — received, the source states, through a waking vision rather than a dream (<em>\"yaqẓatan lā manāman\"<\/em>) — from Shaykh Abū Madyan al-Maghribī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>, whose own chain runs back through Imam al-Ghazālī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> and Imam al-Ḥaramayn al-Juwaynī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>, with a documented related connection to ʿAbd al-Qādir al-Jīlānī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s own circle in Baghdad — corroborating, from an entirely separate primary source, the same convergence of the Bā ʿAlawī chain onto both the Qādirī and the Ghazālian lines already documented in Section VII below.<\/p>\n<p lang=\"ar\" dir=\"rtl\"><strong>Ziyārah etiquette in Tarīm itself.<\/strong> The same source records a rule of precedence observed among the gnostics of the tradition: لا ينبغي للزائر لمقابر تريم أن يزور واحداً قبل شيخ الشيوخ جمال الدين محمد بن علي المذكور، ولو كان شيخاً أو والداً أو قريباً<\/p>\n<p><strong>\"It is not fitting for a visitor to the graves of Tarīm to visit anyone before Shaykh al-Shuyūkh Jamāl al-Dīn Muḥammad ibn ʿAlī, even if that other person were his own shaykh, father, or relative\"<\/strong> — a rule of etiquette governing devotional practice at the very graves the accusatory literature treats as evidence of shirk, here shown regulated by considered precedence rather than indiscriminate veneration.<\/p>\n<p><strong>From Imam al-Ḥaddād <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s own compiled works (<\/strong><strong><em>Silsilat Kutub al-Imām al-Ḥaddād<\/strong><strong><\/em>, pp. 1420–1421) — the tradition's own central later authority drawing exactly this distinction between legitimate and excessive grave-practice, generations after al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> himself:<\/strong><\/p>\n<blockquote lang=\"ar\" dir=\"rtl\"><p>ومن السادة آل أبي علوي، من كان يجلس عند قبر سيدنا الفقيه المقدم الجلوس الطويل، وهو في حر الشمس، بحيث لو عصرت ثيابه من كثرة العرق لخرج منها، وهو لا يشعر بذلك من كثرة الاستغراق في الدعاء، نقل ذلك عن الشيخ عبد الله بن علوي وغيره. وأما التمسح بالقبور، والتقبيل لها فغير مستحب بل هو مكروه، وأشد كراهة منه الطواف بها<\/p><\/blockquote>\n<p><strong>\"Among the Sādah Āl Abī ʿAlawī was one who used to sit at the grave of our master al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> for long sittings, in the heat of the sun, such that if his clothes were wrung out from sweat it would pour out, unaware of this from his deep absorption in supplication — narrated from Shaykh ʿAbdullāh ibn ʿAlawī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> and others. As for touching graves or kissing them, that is not recommended but disliked [<\/strong><strong><em>makrūh<\/strong><strong><\/em>], and circumambulating them is more disliked still.\"<\/strong> Al-Ḥaddād <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> immediately follows this with the general ziyārah-etiquette he taught — reciting what one can of the Qur'ān for the deceased, standing preferably at the head rather than facing the body directly, and remembering one's own mortality — all consistent with the restrained, Sunnah-anchored devotional practice this document documents throughout, rather than the unregulated grave-veneration the accusatory literature alleges.<\/p>\n<p><strong>A fuller account of al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s own asceticism<\/strong>, also from al-Ḥaddād <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s compiled works (pp. 562–563), in a passage cataloguing karāmāt of extreme self-denial among the early Sufis:<\/p>\n<blockquote lang=\"ar\" dir=\"rtl\"><p>وعن سيدنا القطب المقدم (محمد بن علي باعلوي) رحمه الله ونفع به، أنه مكث في آخر عمره نحو أربعة أشهر لم يأكل فيها طعاماً ولم يشرب فيها شراباً، فلما كان آخر يوم من حياته أكرهوه على شيء من الطعام<\/p><\/blockquote>\n<p><strong>\"And it is related of our master al-Quṭb al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> [Muḥammad ibn ʿAlī Bā ʿAlawī], may Allah have mercy on him and benefit [us] through him, that in the last part of his life he remained for about four months without eating any food or drinking anything — and on the last day of his life they compelled him to take a little food.\"<\/strong><\/p>\n<p><strong>His investiture, in fuller narrative form.<\/strong> A 1947 lecture by the historian al-Shāṭirī (already drawn on above for the migration account) gives the fuller story behind the khirqah-transmission summarized above: a disciple of Abū Madyan al-Maghribī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>, sent to test al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>, deliberately provoked him while he was still armed in the ordinary tribal manner of his time — and only once he set the weapon aside in response did the disciple invest him with the Sufi garb, the moment from which the \"breaking of the sword\" tradition dates in this fuller telling. An eyewitness record of the same moment from al-Ḥaddād <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s own recorded teaching sessions (<em>Tathbīt al-Fuʾād<\/em>, p. 49) adds a physical detail absent from every other source consulted — he did not merely set the sword down, but <strong>buried it in the earth<\/strong>, saying as he did so, <em>\"al-faqru khayr, al-faqru khayr\"<\/em> (\"poverty is better, poverty is better\"). The same page records a separate, directly on-point anecdote about a different early shaykh, illustrating the exact doctrine this document argues throughout governs all veneration in the tradition: his disciples, unable to reach him through a crowd, took to kissing the hooves of his riding animal instead; asked about this, he answered, إنهم ما عظموني إنما عظموا الله فلا أمنعهم من تعظيم الله — <strong>\"They did not glorify me; they glorified Allah — so I do not prevent them from glorifying Allah.\"<\/strong> A classical primary-source statement, in the plainest possible terms, of the <em>istiqlāl/tasabbub<\/em> principle this response applies throughout: veneration directed at a righteous man, rightly understood, passes through him to Allah rather than competing with Him.<\/p>\n<p><strong>A documented spiritual-pole succession, in al-Ḥaddād <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s own words.<\/strong> Asked directly by a correspondent, Sayyid Aḥmad ibn ʿAwaḍ Bā Ḥusayn ʿAlawī, whether ʿAbd al-Qādir al-Jīlānī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> or al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> was more excellent, Imam al-Ḥaddād <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> answered (<em>Silsilat Kutub al-Imām al-Ḥaddād<\/em>, pp. 1640–1642):<\/p>\n<blockquote lang=\"ar\" dir=\"rtl\"><p>فهما، أعني الشيخ المقدم والشيخ عبد القادر رضي الله عنهما، إمامان كبيران، قطبان جامعان شريفان سُنيان، كل منهما فاضل سابق مقرب. وانتفاعنا واعتمادنا على السيد المقدم أكثر وأظهر، لأنه الأب والشيخ الذي تدور عليه الدوائر في هذه الجهة لنا ولغيرنا... وكذلك الشيخ أبو مدين رضي الله عنه إمام عظيم جامع، وممن قُطِّب أيضاً على ما ذكره العارفون، فانتقلت القطبية من الشيخ عبد القادر إلى الشيخ أبي مدين إلى الشيخ الفقيه المقدم، على الترتيب لا على التوالي<\/p><\/blockquote>\n<p><strong>\"These two — I mean Shaykh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> and Shaykh ʿAbd al-Qādir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> — are two great Imams, two comprehensive, noble, Sunni poles; each of them excellent, preceding, and drawn near [to Allah]. Our own benefit and reliance rest on al-Sayyid al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> more and more manifestly, for he is the father and shaykh around whom the circles [of this path] revolve, for us and for others... Likewise Shaykh Abū Madyan <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> is a great, comprehensive Imam, and was also, as the gnostics have related, himself a spiritual pole — so the poleship passed from Shaykh ʿAbd al-Qādir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> to Shaykh Abū Madyan <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> to Shaykh al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>, in order though not in direct succession.\"<\/strong> He then quotes ʿAbd al-Raḥmān al-Saqqāf <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (already named above) on the same point: <strong>\"We give no one precedence over al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> after the Companions, except one for whom an explicit text of preference exists, like Uways al-Qaranī.\"<\/strong> — the identical standard already recorded above from <em>al-Burqah al-Mashīqah<\/em>, here independently corroborated in al-Ḥaddād <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s own separate compiled correspondence.<\/p>\n<p><strong>A symbolic bequest, tying al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> to his own contemporaries.<\/strong> A separate account (<em>Silsilat Aʿlām Ḥaḍramawt<\/em>, pp. 311–312) records that a North African Sufi master, asked by several disciples whom he would designate as his successor, instead divided his personal effects among them symbolically: his prayer-beads (<em>tasbīḥ<\/em>) and staff — signifying overall leadership — to al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>; a lamp to his close companion Shaykh Saʿīd ibn ʿĪsā al-ʿAmūdī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>; and other items to two further named disciples. The same source (pp. 313–314) preserves the historian al-Shāṭirī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s own two-part analysis, in <em>Adwār al-Tārīkh al-Ḥaḍramī<\/em>, of why al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> made this pivot at all — a fuller account than the bare \"breaking of the sword\" saying given above:<\/p>\n<blockquote lang=\"ar\" dir=\"rtl\"><p>إنما اجتمعت عليه المصادر أن الفقيه المقدم نزع السلاح بل وكسر سيفه، دعا قولاً وفعلاً إلى نزعه، ليقضي على العقيدة القبلية، وبرهن فعلاً على وجوب التعايش السلمي، والأخوة الإسلامية والمذهبية والوطنية بين قبائل الشعب وقطاعاته، وعلى أن سلاح العلم والإيمان هو أقوى الأسلحة في المجتمع، وأمضاها في قيادة الأمة، وتوجهها إلى حياة السعادة والخير والتقدم<\/p><\/blockquote>\n<p><strong>\"What the sources are agreed upon is that al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> laid down arms — indeed broke his sword — and called, in word and deed, for their laying-down, in order to put an end to tribal partisanism, and demonstrated in practice the necessity of peaceful coexistence and of Islamic, confessional, and national brotherhood among the tribes and segments of the people, and [demonstrated] that the weapon of knowledge and faith is the strongest weapon in society, and the most effective in leading the nation toward a life of happiness, good, and progress.\"<\/strong> Al-Shāṭirī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> records the political dimension separately: Ḥaḍramawt's rulers, both before and in al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s own time, viewed the ʿAlawīs with the wary resentment any ruling power shows a family commanding deeper popular loyalty than its own — the same pattern al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> had already witnessed within his own family (his grandfather Ṣāḥib Mirbāṭ <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s migration, forced by this same pressure; his uncle ʿAlawī's death by poisoning, arranged by the ruler of Tarīm at the time) — and that laying down arms removed the family from that cycle of suspicion and vendetta entirely, by removing the premise (armed, tribal rivalry) on which it depended. Parts of the broken sword itself, together with other relics of al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>, were preserved for centuries by the Āl al-ʿAmūdī family at Qaydūn, per his own bequest — a tradition the same source calls \"Khizānat Āl Bā ʿAlawī,\" the Treasury of Āl Bā ʿAlawī, and ties to the enduring spiritual bond between the two families, formalized in the phrase \"<em>ittiḥād kullī<\/em>\" (complete union) and traced to a ḥadīth on the permanence of the Prophet's <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صلى الله عليه وسلم<\/span> own lineage and marriage-ties.<\/p>\n<p><strong>Why he migrated, in his own family's later telling.<\/strong> A 1947 lecture on the sāda's history by the Ḥaḍramī historian <strong>Muḥammad ibn Aḥmad al-Shāṭirī<\/strong>, delivered at Dār al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> in Tarīm itself, adds further texture to Aḥmad al-Muhājir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s migration story recorded in Section I above: it records that al-Muhājir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s own brother, <strong>Muḥammad ibn ʿĪsā<\/strong>, took \"the second path\" and remained in Iraq, rising up against the reigning Abbasid Caliph al-Muqtadir bi-Allāh, before al-Muhājir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> himself persuaded him to abandon the revolt — a direct, named contrast between the political-insurrectionary path his brother nearly took and the path of migration and religious renewal al-Muhājir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> himself chose instead. The same lecture explicitly frames the choice not as passive withdrawal but as the deliberate founding of \"another society in the new homeland,\" including armed resistance, when necessary, to the Ibāḍī-Khārijite majority of Ḥaḍramawt's population who would not be pacified peacefully — with local military support recorded from the people of Wādī Duʿān, \"known for their loyalty to Ahl al-Bayt.\"<\/p>\n<p><em>______________________________________<\/em><\/p>"}, {"slug": "2026-10-21-ba-alawi-sada-part-3-tarim-companions-and-independent-testimony", "title": "The Bā ʿAlawī Sāda: A Comprehensive History, Methodology, and Legacy (Part 3: Tarīm in the Age of the Companions, and Independent Testimony to the Lineage)", "date": "2026-10-14", "time": "20:20", "summary": "The Tarīmī traditions about the riddah, Abū Bakr's duʿāʾ, the Companions buried in Tarīm and Masjid al-Ribāṭ, then the independent testimony to the Bā ʿAlawī lineage from al-Nabhānī and others.", "rtl": false, "minutes": 10, "html": "<p><strong>1. The riddah in Ḥaḍramawt and the siege of al-Nujayr (documented in the classical histories).<\/strong> The Prophet <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صلى الله عليه وسلم<\/span> had appointed Ziyād ibn Labīd al-Bayāḍī al-Anṣārī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنه<\/span> governor over Kindah in Ḥaḍramawt, and Abū Bakr <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنه<\/span> confirmed him. After the Prophet's <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صلى الله عليه وسلم<\/span> death a part of Kindah, under its chieftain al-Ashʿath ibn Qays, refused the authority of the caliphate; Ziyād fought them, al-Muhājir ibn Abī Umayyah <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنه<\/span> (governor of Ṣanʿāʾ) was ordered to reinforce him, and ʿIkrimah <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> ibn Abī Jahl <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنه<\/span> arrived with further forces. The rebels barricaded themselves in the fortress of al-Nujayr, which lies 30km from Tarim and was besieged and taken in the year 12H; al-Ashʿath was captured, brought to Madīnah, pardoned by Abū Bakr <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنه<\/span>, and married to his sister Umm Farwah. The place is defined by Yāqūt al-Ḥamawī in Muʿjam al-Buldān (entry al-Nujayr, as reproduced in the Hawramani Arabic Lexicon): النُّجَيْرُ: حِصْنٌ بِالْيَمَنِ قُرْبَ حَضْرَمَوْتَ مَنِيعٌ لَجَأَ إِلَيْهِ أَهْلُ الرِّدَّةِ — \"al-Nujayr: an impregnable fortress in Yemen near Ḥaḍramawt, to which the apostates took refuge.\"<\/p>\n<p><strong>2. Tarīm's steadfastness, and the duʿāʾ of Abū Bakr <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنه<\/span>.<\/strong> The earliest source for this is the Ḥaḍramī historian ʿAbd al-Qādir ibn Shaykh ibn ʿAbdillāh al-ʿAydarūs <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (d. 1038H), al-Nūr al-Sāfir ʿan Akhbār al-Qarn al-ʿĀshir, in his entry on Tarīm. Writing of the city's merits, he says:<\/p>\n<blockquote lang=\"ar\" dir=\"rtl\"><p>وَيُقَالُ إِنَّ أَبَا بَكْرٍ الصِّدِّيقَ رَضِيَ اللَّهُ عَنْهُ دَعَا لَهَا بِثَلَاثِ دَعَوَاتٍ: أَنْ يَكْثُرَ بِهَا الصَّالِحُونَ، وَأَنْ يُبَارِكَ اللَّهُ فِيمَا بِهَا، وَأَنْ لَا تُطْفَأَ بِهَا نَارٌ إِلَى يَوْمِ الْقِيَامَةِ. وَمَعْنَاهُ: أَنْ لَا تَزَالَ عَامِرَةً إِلَى يَوْمِ الْقِيَامَةِ. وَذَلِكَ حِينَ بَلَغَهُ أَنَّ أَهْلَهَا لَمْ يَرْتَدُّوا كَغَيْرِهِمْ مِنَ الْعَرَبِ الَّذِينَ ارْتَدُّوا بَعْدَ مَوْتِ رَسُولِ اللَّهِ صلى الله عليه وسلم<\/p><\/blockquote>\n<blockquote><p>\"It is said that Abū Bakr al-Ṣiddīq <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنه<\/span> made three supplications for it (Tarim): that the righteous be many in it, that Allah bless what is in it, and that no fire be extinguished in it until the Day of Resurrection — meaning that it will remain inhabited until the Day of Resurrection. That was when word reached him that its people had not apostatised, as others of the Arabs did after the death of the Messenger of Allah <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صلى الله عليه وسلم<\/span>.\"<\/p><\/blockquote>\n<p>For this reason one of the names of the city of Tarim still in vogue today is ‘Madinah al Siddiq’ (The City of (Abu Bakr) al Siddiq due to his three supplications that he made for it.<\/p>\n<p>It is therefore a Tarīmī tradition — repeated often in variations, i.e the a duʿāʾ that the city be preserved to the end of time, that water be abundant, and that scholars come forth from it \"like shoots after the rain\"<\/p>\n<p><strong>3. Companions buried in Tarīm.<\/strong> In the same entry, al-ʿAydarūs <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> writes, after describing the concentration of scholars in Tarīm:<\/p>\n<blockquote lang=\"ar\" dir=\"rtl\"><p>وَيُذْكَرُ أَنَّهَا تُنْبِتُ الصَّالِحِينَ كَمَا تُنْبِتُ الْأَرْضُ الْبَقْلَ، وَاجْتَمَعَ بِهَا فِي عَصْرٍ وَاحِدٍ مِنَ الْعُلَمَاءِ الَّذِينَ بَلَغُوا رُتْبَةَ الْإِفْتَاءِ ثَلَاثُمِائَةِ رَجُلٍ، وَأَنَّ بِمَقْبَرَتِهَا جَمَاعَةً مِمَّنْ شَهِدَ بَدْرًا مَعَ رَسُولِ اللَّهِ صلى الله عليه وسلم وَغَيْرِهِمْ مِنَ الصَّحَابَةِ رَضِيَ اللَّهُ عَنْهُمْ، وَأَنَّ عَدَدَهُمْ سَبْعُونَ نَفَرًا، وَكَانَ الشَّيْخُ عَبْدُ الرَّحْمَنِ السَّقَّافُ رَضِيَ اللَّهُ عَنْهُ إِذَا زَارَ قُبُورَ تَرِيمَ يُشِيرُ إِلَى مَكَانِ قُبُورِهِمْ فِي مَحَلٍّ مَخْصُوصٍ هُنَاكَ<\/p><\/blockquote>\n<blockquote><p>\"It is mentioned that it brings forth the righteous as the earth brings forth vegetation; that three hundred men who had reached the rank of issuing fatwā were gathered in it in a single age; and that in its cemetery are Companions who witnessedthe Battle of  Badr with the Messenger of Allah <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صلى الله عليه وسلم<\/span> and other Companions <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنهم<\/span>, their number being seventy persons; and that Shaykh ʿAbd al-Raḥmān al-Saqqāf <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>, when he visited the graves of Tarīm, would point to the place of their graves, in a specific spot there.\"<\/p><\/blockquote>\n<p lang=\"ar\" dir=\"rtl\">He continues: وَرُوِيَ عَنْهُ أَنَّهُ قَالَ: فِي تُرْبَةِ آلِ أَبَا عَلَوِيٍّ ثَمَانُونَ قُطْبًا كُلُّهُمْ أَشْرَافٌ — \"and it is related from him that he said: in the burial-ground of the Āl Abā ʿAlawī are eighty Quṭbs, all of them of Prophetic lineage.\"<\/p>\n<p><strong>4. Masjid al-Ribāṭ, Ḥārat al-Ruḍaymah, Tarīm.<\/strong> At the very spot which the Sahabah tied their mounts when entering Tarim was built a masjid of its namesake and oral tradition till today holds the transmission that this Masjid was built to commemorate the momentous moment of the arrival of the Sahabah to the city of Tarim<\/p>\n<hr>\n<h4>Independent testimony to the lineage and rank of the Bā ʿAlawī — including Imām Yūsuf al-Nabhānī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/h4>\n<p>The testimony of a tradition's own scholars to its rank, even sometimes necessary in order to acknowledge favour and distinction is understood (as is witnessed on much of what has been mentioned about Tarim and the Ba Alawi Sadah), however what carries even more weight is the testimony of scholars outside it. The best-attested independent statement is that of Shaykh Yūsuf ibn Ismāʿīl al-Nabhānī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (d. 1350H), the Shāfiʿī judge and prolific author of Beirut, in the introduction to his Riyāḍ al-Jannah fī Adhkār al-Kitāb wa'l-Sunnah. It comes in a digression (istiṭrād) prompted by his meeting in Beirut with a Bā ʿAlawī of the Sādāh of Madīnah, Sayyid Zayn al-ʿĀbidīn Jamal al-Layl ibn ʿAbd al-Raḥmān Bā ʿAlawī, whose grandfather of the same name, the Muftī of Madīnah, had written Rāḥat al-Arwāḥ bi-Dhikr al-Fattāḥ, a work Shaykh al-Nabhānī borrowed from him and drew on. He then writes:<\/p>\n<blockquote lang=\"ar\" dir=\"rtl\"><p>اسْتِطْرَادٌ: إِنَّ سَادَاتِنَا آلَ بَاعَلَوِيٍّ — الَّذِينَ هَذَا الْفَاضِلُ مِنْهُمْ رَضِيَ اللَّهُ عَنْهُمْ — قَدْ أَجْمَعَتِ الْأُمَّةُ الْمُحَمَّدِيَّةُ فِي سَائِرِ الْأَعْصَارِ وَالْأَقْطَارِ عَلَى أَنَّهُمْ مِنْ أَصَحِّ أَهْلِ بَيْتِ النُّبُوَّةِ نَسَبًا، وَأَثْبَتِهِمْ حَسَبًا، وَأَكْثَرِهِمْ عِلْمًا وَعَمَلًا وَفَضْلًا وَأَدَبًا، وَهُمْ كُلُّهُمْ مِنْ أَهْلِ السُّنَّةِ وَالْجَمَاعَةِ عَلَى مَذْهَبِ إِمَامِنَا الشَّافِعِيِّ رَضِيَ اللَّهُ عَنْهُ، مَعَ كَثْرَتِهِمْ إِلَى دَرَجَةٍ لَا يَقِلُّونَ فِيهَا عَنْ مِائَةِ أَلْفِ إِنْسَانٍ، وَمَعَ مُجَاوَرَةِ بِلَادِهِمْ، وَهِيَ بِلَادُ حَضْرَمَوْتَ، إِلَى الزَّيْدِيَّةِ فِي الْيَمَنِ، وَمَعَ تَفَرُّقِهِمْ فِي سَائِرِ الْبِلَادِ وَلَا سِيَّمَا بِلَادُ الْهِنْدِ. أَمَّا عُلَمَاؤُهُمُ الْكِبَارُ وَأَوْلِيَاؤُهُمُ الْأَخْيَارُ، أَصْحَابُ الْأَنْوَارِ وَالْأَسْرَارِ، فِي هَذَا الْعَصْرِ وَمَا تَقَدَّمَهُ مِنَ الْأَعْصَارِ، فَهُمْ أَكْثَرُ وَأَنْوَرُ مِنْ نُجُومِ السَّمَاءِ، بِهِمْ يَحْصُلُ لِكُلِّ مَنِ اقْتَدَى بِهِمُ الِاهْتِدَاءُ، وَلَا يَمْتَرِي فِي صِحَّةِ نَسَبِهِمْ وَكَثْرَةِ فَضَائِلِهِمْ وَمَزَايَاهُمُ الَّتِي تَمَيَّزُوا بِهَا عَنِ الْأَنَامِ بِبَرَكَةِ جَدِّهِمْ عَلَيْهِ الصَّلَاةُ وَالسَّلَامُ إِلَّا مَنْ قَلَّ حَظُّهُ فِي الْإِسْلَامِ<\/p><\/blockquote>\n<blockquote><p>\"A digression: our masters the Āl Bā ʿAlawī — of whom this excellent man is one, may Allah be pleased with them — the Muḥammadan community, in all ages and lands, has agreed that they are among the soundest of the Ahl al-Bayt of the Prophethood in lineage, the most firmly established in descent [ḥasab], and the most abundant in knowledge, deed, virtue and refinement; that all of them are of Ahl al-Sunnah wa'l-Jamāʿah on the school of our imam al-Shāfiʿī, despite their numbers reaching a degree not below a hundred thousand people, despite the proximity of their land, Ḥaḍramawt, to the Zaydīs of Yemen, and despite their dispersal through all lands, especially India. As for their great scholars and their righteous saints, the possessors of lights and secrets, in this age and the ages before it, they are more numerous and more luminous than the stars of the sky; guidance is attained by everyone who follows them; and none doubts the soundness of their lineage and the abundance of their virtues and distinctions - by which they are distinguished from mankind by the blessing of their grandfather <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صلى الله عليه وسلم<\/span>, - except one whose portion of faith in Islam is miniscule.\"<\/p><\/blockquote>\n<p>He then adds a first-hand attestation, in the same digression: he had read some of their works and found them \"all guidance, polishing the rust from the heart\"; had met some of them and found in them virtues and noble character \"that fill the eyes with delight and the hearts with joy\"; and had corresponded with some and found in their letters gentleness, humility and beauty of expression \"such that a believer could not come to know it without loving its author deeply\" — and that whatever praise he gave them, \"it is less than what my heart holds for them of loyalty and belief in their perfection.\"<\/p>\n<p>What his statement establishes, is that a leading Shāfiʿī scholar and author outside Ḥaḍramawt, who had read their books, met some of them and corresponded with others, held them to be among the soundest of the Prophet's <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صلى الله عليه وسلم<\/span> descendants in lineage and among the most learned and devout, and Ash'ari in creed and Shāfiʿī in law.<\/p>\n<p><strong>Other independent testimonies:<\/strong> Dr. Muḥammad Abū Bakr Bādhīb, in praising the Ba Alawi Sadah also cites:<\/p>\n<ul><li>Murtaḍā al-Zabīdī, the most famous commentator on the Ihya Ulum al Din of Imam Ghazali in (al-Rawḍ) describing Aḥmad ibn ʿĪsā al-Naqīb \"al-Rūmī\" as \"the ancestor of this blessed lineage\"<\/li><\/ul>\n<ul><li>Ibn Ḥajar al-Haytamī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>, in an ijāzah said to be dated 942H, on the combination of sharīʿah and ḥaqīqah among them; in his own collection of chains of transmission (al-Masānid), listing his Sufi teachers, Ibn Ḥajar al-Haytamī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> — names Abū Bakr al-ʿAydarūs <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> among them and states, that the Bā ʿAlawī ṭarīqah is:<\/li><\/ul>\n<p>\"جليلة عالية المقدار\" (jalīlah ʿāliyat al-miqdār, \"a venerable path of lofty standing\"), and gives his own chain through it — ʿAbdullāh al-ʿAydarūs ← Abū Bakr al-ʿAydarūs ← ʿAbd al-Raḥmān al-Saqqāf ← Muḥammad ← ʿAlī ← ʿAlawī ← Muḥammad ← ʿAlī ← Muḥammad ← ʿAlī ← ʿAlawī ← Muḥammad ← ʿAlawī ← ʿUbaydillāh ← Aḥmad [al-Muhājir] ← ʿĪsā ← Muḥammad ← ʿAlī ← Jaʿfar al-Ṣādiq ← Muḥammad al-Bāqir ← Zayn al-ʿĀbidīn ← al-Ḥusayn ← ʿAlī ← the Messenger of Allah <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صلى الله عليه وسلم<\/span> — the identical chain already given above from al-Manhaj al-Sawī and ʿIqd al-Yawāqīt.<\/p>\n<ul><li>and Jaʿfar ibn Abī Bakr al-Labanī on their rigorous procedures for verifying their genealogies.<\/li><\/ul>\n<p>The same treatise sets out the formal juristic basis for accepting a documented sayyid lineage of this kind: a citation attributed to Ibn Rushd <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (\"there is no disagreement on this\") and to Imam Mālik <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (via Sīdī Khalīl's al-Tawḍīḥ and Ibn Khaldūn <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>) that people are to be believed about their own lineage; a named fatwā from Shaykh Ibrāhīm al-Riyāḥī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>, head of the Mālikī council of North Africa, on establishing noble lineage (sharaf) through samāʿ (received oral report) where it is unanimous and uncontested; and the listing of lineage (nasab) among the matters classical fiqh accepts as established by istifāḍah (widespread repute) alone, in both Ibn Ḥajar al-Haytamī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s own Tuḥfah and the Ḥanafī Radd al-Muḥtār, alongside death, waqf, marriage, and judicial appointment.<\/p>\n<p>Two further named historical fatwās are cited specifically endorsing the Bā ʿAlawī written genealogical register (shajarah) as reliable:<\/p>\n<ul><li>al-ʿAllāmah ʿAlī ibn ʿUmar al-ʿArshānī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> ruled that a judge, muftī, or witness may rely on the known Āl ʿAlawī shajarah for lineage testimony without requiring a full chain, treating it like istifāḍah;<\/li><li>and Sayyid Abū Bakr ibn Aḥmad Bāfaqīh <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>, asked whether one may rely on the shajarah authored by Shaykh ʿAbdullāh al-ʿAydarūs <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>, ruled yes — co-signed by two further named jurists — on the grounds that its compiler was a trustworthy scholar who spoke only with knowledge and proof.<\/li><\/ul>\n<p>The treatise also records a specific historical verification episode: during a period when the lineage connection was disputed, the sādah sent the ḥāfiẓ Sayyid al-Ḥasan ʿAlī ibn Zayn Ḥaydar to Iraq specifically to re-verify it with witnesses, after which — the treatise states — pilgrims from Ḥaḍramawt attested to it as well as was done earlier by the son of Al-Muhajir Ahmad bin Isa, Ubaydullah who went he went back to Makkah and Basra to collect testimonies and witnesses to their lineage when some detractors doubted the lineage of Al Muhajir Ahmad bin Isa after his arrival in Hadramwt.<\/p>\n<p>The fiqh maxim unanimously agreed upon is: al-nās muʾminūn ʿalā ansābihim (\"people are to be believed regarding their own lineages\" — the burden of proof falls on whoever disputes a lineage, failing which the objector himself becomes liable as a qādhif, a slanderer):<\/p>\n<blockquote lang=\"ar\" dir=\"rtl\"><p>إن أمة الإسلام أمة الإسناد، واختصت بهذه الصفة عن سائر الأمم، ونقل إلينا القرآن الكريم بالإسناد، ونقلت إلينا السنة المطهرة بالإسناد، وكذا التواريخ والأنساب والمغازي والسير؛ وإذا تركنا لكل شخص أن يطلق لسانه فيما ثبت سيتمادى بهم الأمر إلى تكذيب كثير من الأحكام الشرعية والحوادث التاريخية لكونها لم تعجبهم ولم توافق هواهم... وهو أن الناس مؤمنون على أنسابهم، فمن ثبت نسبه وطعن فيه غيره فعليه الإثبات بالبينة، وإلا يُعَدّ باعتباره قاذفاً<\/p><\/blockquote>\n<blockquote><p>\"The Muslim community is, [above all,] the community of 'chains of transmission' (isnād), a quality that distinguishes it from every other nation. The Noble Qurʾān was conveyed to us by isnād, the purified Sunnah was conveyed to us by isnād, and likewise history, genealogy, military campaigns, and biography (were conveyed by Isnad). If we allowed every person free rein to speak against what is [already] established, matters would proceed to denying many legal rulings and historical events, simply because it does not please them or suit their inclination... and [the governing principle is] that people are to be believed regarding their own lineages: whoever has an established lineage, and is impugned by another, the burden of proof by clear evidence falls on the objector — failing which he is to be reckoned a slanderer.\"<\/p><\/blockquote>"}, {"slug": "2026-10-21-ba-alawi-sada-part-2-preface-and-origins", "title": "The Bā ʿAlawī Sāda: A Comprehensive History, Methodology, and Legacy (Part 2: Preface and Origins)", "date": "2026-10-07", "time": "20:19", "summary": "Why this study was written, and the first section: the descent of the Bā ʿAlawī sāda and the migration of Aḥmad ibn ʿĪsā al-Muhājir from Baṣrah to Ḥaḍramawt, with the primary sources quoted.", "rtl": false, "minutes": 10, "html": "<h3>Preface<\/h3>\n<p>Accusations of heterodoxy are sometimes made against the Bā ʿAlawī sāda — the Ḥusaynid sayyid family of Ḥaḍramawt, Yemen, from whom Ḥabīb ʿUmar bin Ḥafīẓ and the modern seminary of Dār al-Muṣṭafā descend — by people who, on the evidence of what they actually cite, appear never to have opened a single volume of the tradition's own history, read a single work by its founding Imams, traced a single chain of its transmission, or asked what its own scholars — across more than eleven centuries — have said about their own method, their own creed, and their own relationship to the Qur'ān and Sunnah. A judgement formed entirely from secondhand video clips and captioned stills, with no engagement with a tradition's primary literature, cannot distinguish an isolated local excess from a foundational teaching, because it never learns what the foundational teaching actually is.<\/p>\n<p>This document exists to correct that gap directly, from the tradition's own primary sources, catalogued above. The picture that emerges is not that of a fringe or syncretistic movement. It is a documented, continuously-transmitted, self-consciously orthodox Sunni scholarly and spiritual tradition — Ashʿarī in creed, Shāfiʿī in law, explicitly and repeatedly anchored to the Qur'ān and Sunnah, explicitly and repeatedly hostile to extremism in either direction — and one responsible, through eleven centuries of scholarship and missionary activity, for the spread of Islam across a very large part of the inhabited world, not least the Indian subcontinent, maritime Southeast Asia, and the East African coast.<\/p>\n<p>Nothing here is offered as an argument against any other legitimate school or path within Sunni Islam. It is offered as what it plainly is: an account, as detailed as the available primary literature allows, of who the Bā ʿAlawī sāda are, where they came from, what they teach, how they have lived, and what they have, as a matter of historical record, accomplished.<\/p>\n<hr>\n<h3>I. Origins: The Migration of Aḥmad ibn ʿĪsā al-Muhājir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/h3>\n<p>The Bā ʿAlawī sāda trace their descent, without interruption, to the Prophet <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صلى الله عليه وسلم<\/span> through his grandson <strong>al-Ḥusayn ibn ʿAlī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنه<\/span><\/strong>, and from him through six further named generations to their eponymous migrant ancestor. The full chain, as given identically in both <em>al-Manhaj al-Sawī<\/em> (p. 19) and <em>ʿIqd al-Yawāqīt<\/em> (Vol. 1, p. 10), is:<\/p>\n<p><strong>al-Ḥusayn ibn ʿAlī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنه<\/span> → ʿAlī Zayn al-ʿĀbidīn <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> → Muḥammad al-Bāqir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> → Jaʿfar al-Ṣādiq <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> → ʿAlī al-ʿUraydī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> → Muḥammad al-Naqīb <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> → ʿĪsā al-Naqīb <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> → Aḥmad ibn ʿĪsā, \"al-Muhājir ilā Allāh\" <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>.<\/strong><\/p>\n<p><em>ʿIqd al-Yawāqīt<\/em> (Vol. 1, p. 10) preserves this chain in still fuller form as the author's own ancestral line, and it is worth reproducing at length because it is the single clearest primary-source statement of how the entire family's nomenclature developed, generation by generation, from Aḥmad al-Muhājir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> down to the family's various later branch-names:<\/p>\n<ol><li><strong>al-Ḥusayn ibn ʿAlī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنه<\/span><\/strong> (&amp; Fāṭimah al-Zahrāʾ <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنها<\/span>)<\/li><li><strong>ʿAlī Zayn al-ʿĀbidīn <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong><\/li><li><strong>Muḥammad al-Bāqir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong><\/li><li><strong>Jaʿfar al-Ṣādiq <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong><\/li><li><strong>ʿAlī al-ʿUraydī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong><\/li><li><strong>Muḥammad al-Naqīb <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong><\/li><li><strong>ʿĪsā al-Naqīb <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong><\/li><li><strong>Aḥmad al-Muhājir ibn ʿĪsā <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong> (d. Ḥaḍramawt, after migrating in 317H)<\/li><li><strong>ʿUbaydillāh ibn Aḥmad al-Muhājir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong><\/li><li><strong>ʿAlawī ibn ʿUbaydillāh, \"Mawlā al-Ṣawmaʿah\" <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong> — the eponym from whom \"Banū ʿAlawī / Bā ʿAlawī\" takes its name<\/li><li><strong>Muḥammad ibn ʿAlawī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong><\/li><li><strong>ʿAlawī ibn Muḥammad, \"Ṣāḥib Bayt Jubayr\" <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong><\/li><li><strong>Muḥammad ibn ʿAlawī, \"Khāliʿ Qasam\" <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong><\/li><li><strong>ʿAlī ibn Muḥammad, \"Ṣāḥib Mirbāṭ\" <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong> (d. 556H)<\/li><li><strong>Muḥammad ibn ʿAlī — al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong> (d. 653H), the effective founder of the ṭarīqah, treated in full in Section II below.<\/li><\/ol>\n<p>Aḥmad ibn ʿĪsā al-Muhājir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s family seat was Baṣrah, in southern Iraq, where the Prophet's <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صلى الله عليه وسلم<\/span> household had traditionally enjoyed sanctity and protection. By the early fourth Islamic century, that protection had collapsed. <em>Al-Manhaj al-Sawī<\/em> (p. 19–20) records that as Abbasid authority weakened, Baṣrah was struck by repeated disasters — worst among them the Qarāmiṭah (Qarmatians), a violent millenarian faction who sacked the city at the start of the century, and the rising power of the Zanj faction. Facing this, and facing the spread of doctrinal innovation and sectarian dispute among the Muslims of Iraq more broadly, Aḥmad ibn ʿĪsā <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> made the decision that gave him his title:<\/p>\n<blockquote lang=\"ar\" dir=\"rtl\"><p>في تلك الظروف المضطربة التي لا يطيق الصالحون المتحامون عن الدنيا مثلها، في عام ٣١٧هـ بالتحديد، هاجر الإمام أحمد بن عيسى، الذي لُقّب لذلك بالمهاجر، فارّاً بدينه من تلك الفتن المائجة، تاركاً البصرة، في صحبة سبعين من أهله وأتباعه<\/p><\/blockquote>\n<blockquote><p>\"In those turbulent circumstances which righteous men who guard themselves from worldliness cannot endure, in the year 317H precisely, Imam Aḥmad ibn ʿĪsā migrated — for which he was titled 'al-Muhājir' — fleeing with his religion from that surging strife, leaving Baṣrah in the company of seventy of his family and followers.\" (<em>al-Manhaj al-Sawī<\/em>, p. 20)<\/p><\/blockquote>\n<p>Imam al-Ḥaddād <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> himself, writing some seven centuries later in <em>Risālat al-Muʿāwanah<\/em> (\"The Book of Assistance\"), gives the identical account in his own voice, naming the specific religious cause of the migration — not merely political instability, but the spread of theological error — and explicitly noting the family's subsequent freedom from the doctrinal deviation that afflicted other branches of the Prophet's <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صلى الله عليه وسلم<\/span> household:<\/p>\n<blockquote lang=\"ar\" dir=\"rtl\"><p>وكان الإمام المهاجر إلى الله جد السادة المذكورين سيدي أحمد بن عيسى بن محمد بن علي بن الإمام جعفر الصادق، لما رأى ظهور البدع وكثرة الأهواء واختلاف الآراء بالعراق هاجر منها... ولم يزل ينتقل في الأرض حتى أتى أرض حضرموت، فأقام بها إلى أن توفي، فبارك الله في عقبه حتى اشتهر منهم الجَمُّ الغفير بالعلم والعبادة والولاية والمعرفة، ولم يعرض لهم ما يعرض لجماعات من أهل البيت النبوي من انتحال البدع واتباع الأهواء المضلة ببركة هذا الإمام المؤتمن بدينه وفراره من مواضع الفتن<\/p><\/blockquote>\n<blockquote><p>\"The Imam who migrated to Allah, ancestor of the aforementioned sāda, was my master Aḥmad ibn ʿĪsā ibn Muḥammad ibn ʿAlī ibn al-Imām Jaʿfar al-Ṣādiq — when he saw the emergence of heretical innovations, the proliferation of factional desires, and the divergence of opinions in Iraq, he emigrated from it... and did not cease moving through the land until he reached the land of Ḥaḍramawt, where he settled until he died. Allah blessed his progeny until a great multitude of them became renowned for knowledge, worship, sainthood, and gnosis, and they were not afflicted with what afflicted [other] groups of the Prophetic Household — the embrace of innovations and the following of misguiding desires — owing to the trustworthiness of this Imam in his religion and his flight from places of tribulation.\" (<em>Risālat al-Muʿāwanah<\/em>, in <em>Silsilat Kutub al-Imām al-Ḥaddād<\/em> <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>, p. 68)<\/p><\/blockquote>\n<p>Two things in Imam al-Ḥaddād <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s own words deserve to be underlined, because they go directly to the \"authenticity\" question this document exists to answer. First, the migration is explicitly framed as flight from sectarian error, not toward it — Aḥmad al-Muhājir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> left Iraq precisely because it had become a place of bidʿah and factional dispute. Second, Imam al-Ḥaddād <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> — writing as a scholar fully aware that other branches of the Prophet's <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صلى الله عليه وسلم<\/span> household had, across Islamic history, fallen into doctrinal deviation — explicitly and pointedly states that the Bā ʿAlawī branch was spared that fate specifically \"by the blessing of this trustworthy Imam and his flight from places of tribulation.\" This is not incidental praise poetry; it is the tradition's own founding self-understanding, stated by its most authoritative later voice: that its origin lies in a conscious rejection of sectarian extremism, not an accommodation of it.<\/p>\n<p>The route of the migration, per <em>al-Manhaj al-Sawī<\/em> (p. 20) and corroborated in <em>ʿIqd al-Yawāqīt<\/em> (Vol. 1, pp. 213–214, citing the classical historian al-Shillī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s <em>al-Mashraʿ al-Rawī<\/em>), ran through the Ḥijāz — a year's residence at Madīnah, then Makkah, which he reached in the very year the Qarāmiṭah entered the city and tore the Black Stone from its place, independently confirming the 317H date — then across the Arabian desert via ʿAsīr and Yemen into Wādī Ḥaḍramawt. <em>ʿIqd al-Yawāqīt<\/em> adds a further, historically significant detail not present in <em>al-Manhaj al-Sawī<\/em>: that Ḥaḍramawt at the time of his arrival was under Ibāḍī (Khārijite) religious domination, and that Aḥmad al-Muhājir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> is credited, together with his immediate successors, with the region's restoration to mainstream Sunni Islam:<\/p>\n<blockquote lang=\"ar\" dir=\"rtl\"><p>وقبل قدومه كان استيلاء الإباضية بهذه الجهة، حتى طهّرها الله به من البدعة والضلالة بالحجة الصحيحة. ثم خلفه الإمام الكبير، الشيخ العالم سالم [بافضل]... ثم عزّزهما الأستاذ الأعظم الفقيه المقدّم، فقُدّس به ذلك الوادي، وأسّس على التقوى مسجد ذلك النادي، وأظهر فيه عقائد أهل السنة والجماعة، وأحيا العلوم على الصراط المستقيم<\/p><\/blockquote>\n<blockquote><p>\"Before his arrival, Ibāḍī domination held sway over this region, until Allah purified it through him from innovation and misguidance by sound proof. Then he was succeeded by the great Imam, the learned Shaykh Sālim [Bāfaḍl, d. 581H]... then the two of them were reinforced by the Greatest Teacher, al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>, and that valley was sanctified through him, and he founded upon piety the mosque of that gathering-place, and he manifested therein the creeds of Ahl al-Sunnah wa'l-Jamāʿah, and revived the [religious] sciences upon the straight path.\" (<em>ʿIqd al-Yawāqīt<\/em>, Vol. 1, p. 214)<\/p><\/blockquote>\n<p>This is, in other words, a primary-source claim — from the tradition's own classical historiography — that the Bā ʿAlawī sāda's founding role in Ḥaḍramawt was precisely the re-Sunnification of a region that had fallen under sectarian Khārijite control, achieved \"by sound proof,\" not by the sword.<\/p>\n<p>Independent corroboration from a non-Bā-ʿAlawī general history of Ḥaḍramawt (<em>al-Shāmil fī Tārīkh Ḥaḍramawt<\/em>, p. 246), under its own section heading, \"The emergence of the Khawārij in Ḥaḍramawt as the cause of its civilizational decline\": this general history states, independently of any Bā ʿAlawī source, that Khārijite control over the region, beginning in the early second Islamic century, cost Ḥaḍramawt more than two of the best three centuries of Islamic civilization, cutting it off from the wider Muslim world's learning and prosperity, and provoked repeated Umayyad and Abbasid military reprisals in response to Khārijite atrocities committed in the Ḥaramayn themselves. This independently corroborates, from outside the tradition and with added chronological precision, the <em>ʿIqd al-Yawāqīt<\/em> passage quoted above.<\/p>\n<p>Aḥmad al-Muhājir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> settled first at al-Hajarayn, then Qurā Kindah, and finally permanently at al-Ḥusayṣah, where he died in 345H. His son ʿUbaydullāh <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> had three sons — Baṣrī, Jadīd, and ʿAlawī — of whom only the line of ʿAlawī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> survived beyond the sixth Islamic century; every member of Āl Bā ʿAlawī living today descends from this one son.<\/p>\n<p>Fuller biographical detail on ʿUbaydullāh <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> himself (<em>Silsilat Aʿlām Ḥaḍramawt<\/em>, pp. 50–76): his mother's name is recorded as Umm al-Banīn bint Muḥammad ibn ʿĪsā ibn Muḥammad; the family's migration itself included a pilgrimage stop at Madīnah, where they visited the Prophet's <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صلى الله عليه وسلم<\/span> grave, the graves of the Mothers of the Believers, and the Companions' graves — the same source recording that pilgrims that year touched the empty place from which the Qarāmiṭah had torn the Black Stone, independently reinforcing the 317H dating already established above via the Qarāmiṭah's attack on Makkah; ʿUbaydullāh <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> himself later travelled again to the Ḥaramayn for further study and received formal authorization there to teach and issue fatwā; and he is recorded as having been named \"ʿAbdullāh\" at birth, adopting the diminutive \"ʿUbaydullāh\" himself, out of humility. His descendants relocated to Tarīm in 521H, first settled by Imam ʿAlawī ibn ʿUbaydillāh \"Khāliʿ Qasam\" <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (d. 529H;) affectionately called \"al-Ghannāʾ\" (The Richly Abundant) — has remained the tradition's spiritual capital for over nine centuries, honoured also for containing the graves of several Companions <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنهم<\/span> who died there during the Ridda Wars.<\/p>\n<hr>\n<h4>Before the migration: Tarīm in the age of the Companions — the Tarīmī tradition, with each claim placed at its true level of support<\/h4>\n<p>Ḥaḍramawt had a history in Islam long before Aḥmad ibn ʿĪsā <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> arrived, and Tarīm has its own traditions about it — about the riddah, about a duʿāʾ of Abū Bakr al-Ṣiddīq <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنه<\/span>, about Companions buried in its earth, and about the mosque called Masjid al-Ribāṭ. These are collected here because they are part of how Tarīm understands itself, and because Ḥabīb ʿUmar's teaching is delivered in that setting. But they are of very different evidentiary weight, and the account below keeps them apart:<\/p>\n<ol><li>the riddah in Ḥaḍramawt of which Tarim was the only city which did not renegade of their Islam, which is documented in the classical histories;<\/li><li>Tarīm's steadfastness and Abū Bakr <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنه<\/span>'s duʿāʾ, which the earliest Ḥaḍramī source transmits<\/li><li>the Sahabah's graves amongst them 70 of those who partook in the Battle of Badr in same graveyard where every Ba Alawi Sayyid in Tarim since 512AH is laid to rest<\/li><li>Masjid al-Ribāṭ named such because it was where the Sahabah tied (rabata) their camels on arriving in the city<\/li><\/ol>\n<p>To continue in part 3 insha Allah…<\/p>"}, {"slug": "2026-10-21-ba-alawi-sada-part-1-contents", "title": "The Bā ʿAlawī Sāda: A Comprehensive History, Methodology, and Legacy (Part 1: Contents)", "date": "2026-10-01", "time": "09:00", "summary": "The table of contents of the study of the Bā ʿAlawī sāda: sixteen sections from their origins and methodology to their spread across the world and their institutions today.", "rtl": false, "minutes": 2, "html": "<h3>Table of Contents<\/h3>\n<p><strong>Preface<\/strong><\/p>\n<p><strong>I.<\/strong> Origins: The Migration of Aḥmad ibn ʿĪsā al-Muhājir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/p>\n<ul><li>Before the migration: Tarīm in the age of the Companions — the Tarīmī tradition<\/li><li>Independent testimony to the lineage and rank of the Bā ʿAlawī — including Imām Yūsuf al-Nabhānī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/li><li>A Millennial scholarly legacy tradition established 1000 years before later reformist currents even existed<\/li><\/ul>\n<p><strong>II.<\/strong> The Founding of the Ṭarīqah: al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (574–653H)<\/p>\n<p><strong>III.<\/strong> The Great Imams Across the Centuries<\/p>\n<ul><li>Further imams of the chain<\/li><li>Further source for the generation-by-generation chain<\/li><\/ul>\n<p><strong>IV.<\/strong> Their Methodology (Manhaj): Five States, and the Fusion of Sharīʿah with Ḥaqīqah<\/p>\n<p><strong>V.<\/strong> Explicit Creed and Legal School: Ashʿarī and Māturīdī in Theology, Shāfiʿī in Law<\/p>\n<p><strong>VI.<\/strong> Moderation, and the Explicit Rejection of Extremism<\/p>\n<ul><li>A formal fatwā-collection statement on the discipline of restraint from takfīr<\/li><\/ul>\n<p><strong>VII.<\/strong> Mastery of Qur'ān, Ḥadīth, Fiqh, and Kalām<\/p>\n<p><strong>VIII.<\/strong> Piety Without Ostentation: Humility, Self-Criticism, and the Discipline Against Relying on Lineage<\/p>\n<p><strong>IX.<\/strong> Karāmāt and the Discipline Against Seeking Them<\/p>\n<ul><li>A formal legal taxonomy: karāmah, istidrāj, and sorcery distinguished<\/li><li>Imam Al-Ḥaddād <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s own definition of hidden shirk, and his own doctrine of karāmah as subordinate to, never equal to, Prophetic proof<\/li><\/ul>\n<p><strong>X.<\/strong> Imam ʿAbdullāh ibn ʿAlawī al-Ḥaddād <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (1044–1132H): The Tradition's Central Later Figure<\/p>\n<p><strong>XI.<\/strong> The Global Spread of Islam Through the Bā ʿAlawī Sāda: India, East Africa, and the Malay World<\/p>\n<ul><li>The tradition's own account of its spread, in its own words<\/li><\/ul>\n<p><strong>XII.<\/strong> Islam in Southern Africa: Shaykh Yūsuf al-Makassarī, Tuan Guru, and the Cape Karamat Tradition<\/p>\n<ul><li>The two founding figures<\/li><li>What is firmly documented: the Alawiyyah order's Cape footprint<\/li><\/ul>\n<p><strong>XIII.<\/strong> The Rātib al-Ḥaddād: A Living Legacy, in Full 85<\/p>\n<p><strong>XIV.<\/strong> The Living Tradition: Contemporary Bā ʿAlawī Teaching in Its Own Words<\/p>\n<ul><li>Ḥabīb ʿUmar bin Ḥafīẓ's own books talks and lectures<\/li><li>Ḥabīb ʿUmar bin Ḥafīẓ on takfīr, karāmāt, and religious extremism: Mamlakat al-Qalb wa'l-Aʿḍāʾ (\"The Kingdom of the Heart and the Limbs\")<\/li><\/ul>\n<p><strong>XV.<\/strong> The Institutional Present: Ribāṭ Tarīm and Dār al-Muṣṭafā<\/p>\n<p><strong>XVI.<\/strong> Conclusion<\/p>"}];
const view = document.getElementById("view");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = d => { const t = new Date(d + "T12:00:00"); return isNaN(t) ? d : t.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }); };
const dirAttr = p => p.rtl ? ' lang="ar" dir="rtl"' : "";
let query = "";

function home() {
  document.title = "Maḥw al-Rusūm";
  const n = POSTS.length;
  view.innerHTML = `
    <section class="intro">
      <p class="kicker">${n ? n + (n === 1 ? " article" : " articles") : "New site"}</p>
      <h1>Maḥw al-Rusūm</h1>
      <p class="ar-title" lang="ar" dir="rtl">محو الرسوم</p>
      <p>Short articles and notes, newest first.</p>
    </section>
    ${n ? `<div class="search"><label for="q">Search the articles</label>
      <input id="q" type="search" placeholder="Title or word" value="${esc(query)}"></div>
      <ul class="list" id="list"></ul>`
    : `<div class="empty"><h2>The first article is on its way</h2><p>New articles will be listed here, newest first.</p></div>`}`;
  if (!n) return;
  const q = document.getElementById("q");
  q.addEventListener("input", () => { query = q.value; renderList(); });
  renderList();
}

function renderList() {
  const q = query.trim().toLowerCase();
  const hits = POSTS.filter(p => !q || (p.title + " " + p.summary + " " + p.html).toLowerCase().includes(q));
  document.getElementById("list").innerHTML = hits.length ? hits.map(p => `
    <li><a href="#${p.slug}"${dirAttr(p)}>
      <span class="meta" dir="ltr">${fmt(p.date)} · ${p.minutes} min read</span>
      <span class="t">${esc(p.title)}</span>
      <span class="s">${esc(p.summary)}</span>
    </a></li>`).join("") : `<li><p class="meta" style="padding-block:20px">No article matches “${esc(query)}”.</p></li>`;
}

function article(i) {
  const p = POSTS[i], newer = POSTS[i - 1], older = POSTS[i + 1];
  document.title = p.title + " · Maḥw al-Rusūm";
  view.innerHTML = `
    <a class="back" href="#home">← All articles</a>
    <article${dirAttr(p)}>
      <header><h1>${esc(p.title)}</h1><p class="meta" dir="ltr">${fmt(p.date)} · ${p.minutes} min read</p></header>
      <div class="body">${p.html}</div>
    </article>
    <nav class="pager">
      ${older ? `<a href="#${older.slug}"><span class="lbl">← Older</span><span>${esc(older.title)}</span></a>` : ""}
      ${newer ? `<a class="next" href="#${newer.slug}"><span class="lbl">Newer →</span><span>${esc(newer.title)}</span></a>` : ""}
    </nav>`;
  window.scrollTo(0, 0);
}

function route() {
  const h = location.hash.slice(1);
  const i = POSTS.findIndex(p => p.slug === h);
  i >= 0 ? article(i) : home();
}
window.addEventListener("hashchange", route);
route();
</script>

</body>
</html>
