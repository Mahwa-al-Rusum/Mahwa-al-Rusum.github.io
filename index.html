<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Fawāʾid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
/* Layout: one reading column (46rem) under a quiet header; list of articles on the home view, one article per view. Scholarly Press tokens. */
:root {
  --paper: #f4f5f1; --surface: #ffffff; --ink: #1c2220; --ink-muted: #5d6661;
  --rule: #d5d9d2; --accent: #1e6b5c; --accent-soft: #dcebe6; --quote-bg: #f7f8f4; --mark: #f3e39a;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --arabic: "Noto Naskh Arabic", "Geeza Pro", "Traditional Arabic", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141817; --surface: #1b201e; --ink: #e3e8e5; --ink-muted: #9aa5a0;
    --rule: #2e3633; --accent: #6cc2ad; --accent-soft: #20352f; --quote-bg: #1f2522; --mark: #6b5a12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141817; --surface: #1b201e; --ink: #e3e8e5; --ink-muted: #9aa5a0;
  --rule: #2e3633; --accent: #6cc2ad; --accent-soft: #20352f; --quote-bg: #1f2522; --mark: #6b5a12;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--serif); font-size: 18px; line-height: 1.6; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
[lang="ar"] { font-family: var(--arabic); line-height: 2; unicode-bidi: isolate; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--surface); border-bottom: 1px solid var(--rule); }
.top-in { max-width: 46rem; margin: 0 auto; padding-inline: 16px; height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--sans); font-weight: 600; font-size: 17px; color: var(--ink); text-decoration: none; display: flex; align-items: baseline; gap: 10px; }
.brand .ar { font-family: var(--arabic); font-weight: 400; color: var(--ink-muted); font-size: 18px; }
.top nav { font-family: var(--sans); font-size: 14px; }

main { max-width: 46rem; margin: 0 auto; padding-inline: 16px; padding-block: 40px 64px; }
.kicker { font-family: var(--sans); font-size: 12.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px; }
.intro h1 { font-size: 34px; line-height: 1.2; font-weight: 600; margin: 0 0 8px; text-wrap: balance; }
.intro p { color: var(--ink-muted); margin: 0; }

.search { margin-top: 28px; display: flex; flex-direction: column; gap: 6px; }
.search label { font-family: var(--sans); font-size: 12.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
.search input { font: 16px var(--sans); padding: 10px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); width: 100%; }

.list { list-style: none; padding: 0; margin: 28px 0 0; border-top: 1px solid var(--rule); }
.list li { border-bottom: 1px solid var(--rule); }
.list a { display: grid; gap: 4px; padding-block: 20px; text-decoration: none; color: var(--ink); }
.list a:hover .t { color: var(--accent); }
.meta { font-family: var(--sans); font-size: 12.5px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.list .t { font-size: 22px; font-weight: 600; line-height: 1.3; text-wrap: balance; }
.list .s { color: var(--ink-muted); font-size: 16.5px; }
.list [dir="rtl"] .t, .list [dir="rtl"] .s { font-family: var(--arabic); }
.empty { padding: 28px 22px; margin-top: 28px; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; }
.empty h2 { font-size: 20px; margin: 0 0 6px; }
.empty p { margin: 0; color: var(--ink-muted); }

.back { font-family: var(--sans); font-size: 14px; text-decoration: none; }
article header { margin: 24px 0 32px; padding-bottom: 20px; border-bottom: 1px solid var(--rule); }
article h1 { font-size: 34px; line-height: 1.2; font-weight: 600; margin: 0 0 10px; text-wrap: balance; }
article[dir="rtl"] h1 { font-family: var(--arabic); line-height: 1.6; }
.body h2 { font-size: 25px; line-height: 1.3; margin: 36px 0 10px; text-wrap: balance; }
.body h3 { font-size: 20px; margin: 28px 0 8px; }
.body h4 { font-size: 18px; margin: 24px 0 6px; }
.body p, .body ul, .body ol { margin: 0 0 18px; }
.body li { margin-bottom: 6px; }
.body blockquote { margin: 0 0 22px; padding: 14px 18px; background: var(--quote-bg); border-inline-start: 3px solid var(--accent); border-radius: 0 8px 8px 0; }
.body blockquote[dir="rtl"] { border-radius: 8px 0 0 8px; font-size: 21px; }
.body blockquote p { margin: 0; }
.body hr { border: 0; border-top: 1px solid var(--rule); margin: 32px 0; }
article[dir="rtl"] .body { font-family: var(--arabic); font-size: 20px; line-height: 2.1; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 40px; }
.pager a { display: grid; gap: 2px; min-width: 0; padding: 14px 16px; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; text-decoration: none; color: var(--ink); }
.pager a:hover { background: var(--accent-soft); }
.pager .next { text-align: end; grid-column: 2; }
.pager .lbl { font-family: var(--sans); font-size: 12.5px; color: var(--accent); }
footer { max-width: 46rem; margin: 0 auto; padding-inline: 16px; padding-block: 0 40px; font-family: var(--sans); font-size: 13px; color: var(--ink-muted); }
@media (max-width: 560px) {
  body { font-size: 17px; }
  .intro h1, article h1 { font-size: 28px; }
  .pager { grid-template-columns: 1fr; }
  .pager .next { grid-column: 1; }
}
</style>

<div class="top"><div class="top-in">
  <a class="brand" href="#home">Fawāʾid <span class="ar" lang="ar" dir="rtl">فوائد</span></a>
  <nav><a href="#home">All articles</a></nav>
</div></div>

<main id="view"></main>
<footer>Fawāʾid · Articles on the Qur'an, the Sunnah and the scholars.</footer>

<script>
const POSTS = [];
const view = document.getElementById("view");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = d => { const t = new Date(d + "T12:00:00"); return isNaN(t) ? d : t.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }); };
const dirAttr = p => p.rtl ? ' lang="ar" dir="rtl"' : "";
let query = "";

function home() {
  document.title = "Fawāʾid";
  const n = POSTS.length;
  view.innerHTML = `
    <section class="intro">
      <p class="kicker">${n ? n + (n === 1 ? " article" : " articles") : "New site"}</p>
      <h1>Fawāʾid</h1>
      <p>Short articles and notes, newest first.</p>
    </section>
    ${n ? `<div class="search"><label for="q">Search the articles</label>
      <input id="q" type="search" placeholder="Title or word" value="${esc(query)}"></div>
      <ul class="list" id="list"></ul>`
    : `<div class="empty"><h2>The first article is on its way</h2><p>New articles will be listed here, newest first.</p></div>`}`;
  if (!n) return;
  const q = document.getElementById("q");
  q.addEventListener("input", () => { query = q.value; renderList(); });
  renderList();
}

function renderList() {
  const q = query.trim().toLowerCase();
  const hits = POSTS.filter(p => !q || (p.title + " " + p.summary + " " + p.html).toLowerCase().includes(q));
  document.getElementById("list").innerHTML = hits.length ? hits.map(p => `
    <li><a href="#${p.slug}"${dirAttr(p)}>
      <span class="meta" dir="ltr">${fmt(p.date)} · ${p.minutes} min read</span>
      <span class="t">${esc(p.title)}</span>
      <span class="s">${esc(p.summary)}</span>
    </a></li>`).join("") : `<li><p class="meta" style="padding-block:20px">No article matches “${esc(query)}”.</p></li>`;
}

function article(i) {
  const p = POSTS[i], newer = POSTS[i - 1], older = POSTS[i + 1];
  document.title = p.title + " · Fawāʾid";
  view.innerHTML = `
    <a class="back" href="#home">← All articles</a>
    <article${dirAttr(p)}>
      <header><h1>${esc(p.title)}</h1><p class="meta" dir="ltr">${fmt(p.date)} · ${p.minutes} min read</p></header>
      <div class="body">${p.html}</div>
    </article>
    <nav class="pager">
      ${older ? `<a href="#${older.slug}"><span class="lbl">← Older</span><span>${esc(older.title)}</span></a>` : ""}
      ${newer ? `<a class="next" href="#${newer.slug}"><span class="lbl">Newer →</span><span>${esc(newer.title)}</span></a>` : ""}
    </nav>`;
  window.scrollTo(0, 0);
}

function route() {
  const h = location.hash.slice(1);
  const i = POSTS.findIndex(p => p.slug === h);
  i >= 0 ? article(i) : home();
}
window.addEventListener("hashchange", route);
route();
</script>

</body>
</html>
