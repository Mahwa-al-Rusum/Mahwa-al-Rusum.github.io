<script>
const POSTS = [{"slug": "2026-10-21-ba-alawi-sada-part-3-tarim-companions-and-independent-testimony", "title": "The Bā ʿAlawī Sāda: A Comprehensive History, Methodology, and Legacy (Part 3: Tarīm in the Age of the Companions, and Independent Testimony to the Lineage)", "date": "2026-10-14", "time": "20:20", "summary": "The Tarīmī traditions about the riddah, Abū Bakr's duʿāʾ, the Companions buried in Tarīm and Masjid al-Ribāṭ, then the independent testimony to the Bā ʿAlawī lineage from al-Nabhānī and others.", "rtl": false, "minutes": 10, "html": "<p><strong>1. The riddah in Ḥaḍramawt and the siege of al-Nujayr (documented in the classical histories).<\/strong> The Prophet <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صلى الله عليه وسلم<\/span> had appointed Ziyād ibn Labīd al-Bayāḍī al-Anṣārī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنه<\/span> governor over Kindah in Ḥaḍramawt, and Abū Bakr <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنه<\/span> confirmed him. After the Prophet's <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صلى الله عليه وسلم<\/span> death a part of Kindah, under its chieftain al-Ashʿath ibn Qays, refused the authority of the caliphate; Ziyād fought them, al-Muhājir ibn Abī Umayyah <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنه<\/span> (governor of Ṣanʿāʾ) was ordered to reinforce him, and ʿIkrimah <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> ibn Abī Jahl <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنه<\/span> arrived with further forces. The rebels barricaded themselves in the fortress of al-Nujayr, which lies 30km from Tarim and was besieged and taken in the year 12H; al-Ashʿath was captured, brought to Madīnah, pardoned by Abū Bakr <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنه<\/span>, and married to his sister Umm Farwah. The place is defined by Yāqūt al-Ḥamawī in Muʿjam al-Buldān (entry al-Nujayr, as reproduced in the Hawramani Arabic Lexicon): النُّجَيْرُ: حِصْنٌ بِالْيَمَنِ قُرْبَ حَضْرَمَوْتَ مَنِيعٌ لَجَأَ إِلَيْهِ أَهْلُ الرِّدَّةِ — \"al-Nujayr: an impregnable fortress in Yemen near Ḥaḍramawt, to which the apostates took refuge.\"<\/p>\n<p><strong>2. Tarīm's steadfastness, and the duʿāʾ of Abū Bakr <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنه<\/span>.<\/strong> The earliest source for this is the Ḥaḍramī historian ʿAbd al-Qādir ibn Shaykh ibn ʿAbdillāh al-ʿAydarūs <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (d. 1038H), al-Nūr al-Sāfir ʿan Akhbār al-Qarn al-ʿĀshir, in his entry on Tarīm. Writing of the city's merits, he says:<\/p>\n<blockquote lang=\"ar\" dir=\"rtl\"><p>وَيُقَالُ إِنَّ أَبَا بَكْرٍ الصِّدِّيقَ رَضِيَ اللَّهُ عَنْهُ دَعَا لَهَا بِثَلَاثِ دَعَوَاتٍ: أَنْ يَكْثُرَ بِهَا الصَّالِحُونَ، وَأَنْ يُبَارِكَ اللَّهُ فِيمَا بِهَا، وَأَنْ لَا تُطْفَأَ بِهَا نَارٌ إِلَى يَوْمِ الْقِيَامَةِ. وَمَعْنَاهُ: أَنْ لَا تَزَالَ عَامِرَةً إِلَى يَوْمِ الْقِيَامَةِ. وَذَلِكَ حِينَ بَلَغَهُ أَنَّ أَهْلَهَا لَمْ يَرْتَدُّوا كَغَيْرِهِمْ مِنَ الْعَرَبِ الَّذِينَ ارْتَدُّوا بَعْدَ مَوْتِ رَسُولِ اللَّهِ صلى الله عليه وسلم<\/p><\/blockquote>\n<blockquote><p>\"It is said that Abū Bakr al-Ṣiddīq <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنه<\/span> made three supplications for it (Tarim): that the righteous be many in it, that Allah bless what is in it, and that no fire be extinguished in it until the Day of Resurrection — meaning that it will remain inhabited until the Day of Resurrection. That was when word reached him that its people had not apostatised, as others of the Arabs did after the death of the Messenger of Allah <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صلى الله عليه وسلم<\/span>.\"<\/p><\/blockquote>\n<p>For this reason one of the names of the city of Tarim still in vogue today is ‘Madinah al Siddiq’ (The City of (Abu Bakr) al Siddiq due to his three supplications that he made for it.<\/p>\n<p>It is therefore a Tarīmī tradition — repeated often in variations, i.e the a duʿāʾ that the city be preserved to the end of time, that water be abundant, and that scholars come forth from it \"like shoots after the rain\"<\/p>\n<p><strong>3. Companions buried in Tarīm.<\/strong> In the same entry, al-ʿAydarūs <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> writes, after describing the concentration of scholars in Tarīm:<\/p>\n<blockquote lang=\"ar\" dir=\"rtl\"><p>وَيُذْكَرُ أَنَّهَا تُنْبِتُ الصَّالِحِينَ كَمَا تُنْبِتُ الْأَرْضُ الْبَقْلَ، وَاجْتَمَعَ بِهَا فِي عَصْرٍ وَاحِدٍ مِنَ الْعُلَمَاءِ الَّذِينَ بَلَغُوا رُتْبَةَ الْإِفْتَاءِ ثَلَاثُمِائَةِ رَجُلٍ، وَأَنَّ بِمَقْبَرَتِهَا جَمَاعَةً مِمَّنْ شَهِدَ بَدْرًا مَعَ رَسُولِ اللَّهِ صلى الله عليه وسلم وَغَيْرِهِمْ مِنَ الصَّحَابَةِ رَضِيَ اللَّهُ عَنْهُمْ، وَأَنَّ عَدَدَهُمْ سَبْعُونَ نَفَرًا، وَكَانَ الشَّيْخُ عَبْدُ الرَّحْمَنِ السَّقَّافُ رَضِيَ اللَّهُ عَنْهُ إِذَا زَارَ قُبُورَ تَرِيمَ يُشِيرُ إِلَى مَكَانِ قُبُورِهِمْ فِي مَحَلٍّ مَخْصُوصٍ هُنَاكَ<\/p><\/blockquote>\n<blockquote><p>\"It is mentioned that it brings forth the righteous as the earth brings forth vegetation; that three hundred men who had reached the rank of issuing fatwā were gathered in it in a single age; and that in its cemetery are Companions who witnessedthe Battle of  Badr with the Messenger of Allah <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صلى الله عليه وسلم<\/span> and other Companions <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنهم<\/span>, their number being seventy persons; and that Shaykh ʿAbd al-Raḥmān al-Saqqāf <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>, when he visited the graves of Tarīm, would point to the place of their graves, in a specific spot there.\"<\/p><\/blockquote>\n<p lang=\"ar\" dir=\"rtl\">He continues: وَرُوِيَ عَنْهُ أَنَّهُ قَالَ: فِي تُرْبَةِ آلِ أَبَا عَلَوِيٍّ ثَمَانُونَ قُطْبًا كُلُّهُمْ أَشْرَافٌ — \"and it is related from him that he said: in the burial-ground of the Āl Abā ʿAlawī are eighty Quṭbs, all of them of Prophetic lineage.\"<\/p>\n<p><strong>4. Masjid al-Ribāṭ, Ḥārat al-Ruḍaymah, Tarīm.<\/strong> At the very spot which the Sahabah tied their mounts when entering Tarim was built a masjid of its namesake and oral tradition till today holds the transmission that this Masjid was built to commemorate the momentous moment of the arrival of the Sahabah to the city of Tarim<\/p>\n<hr>\n<h4>Independent testimony to the lineage and rank of the Bā ʿAlawī — including Imām Yūsuf al-Nabhānī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/h4>\n<p>The testimony of a tradition's own scholars to its rank, even sometimes necessary in order to acknowledge favour and distinction is understood (as is witnessed on much of what has been mentioned about Tarim and the Ba Alawi Sadah), however what carries even more weight is the testimony of scholars outside it. The best-attested independent statement is that of Shaykh Yūsuf ibn Ismāʿīl al-Nabhānī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (d. 1350H), the Shāfiʿī judge and prolific author of Beirut, in the introduction to his Riyāḍ al-Jannah fī Adhkār al-Kitāb wa'l-Sunnah. It comes in a digression (istiṭrād) prompted by his meeting in Beirut with a Bā ʿAlawī of the Sādāh of Madīnah, Sayyid Zayn al-ʿĀbidīn Jamal al-Layl ibn ʿAbd al-Raḥmān Bā ʿAlawī, whose grandfather of the same name, the Muftī of Madīnah, had written Rāḥat al-Arwāḥ bi-Dhikr al-Fattāḥ, a work Shaykh al-Nabhānī borrowed from him and drew on. He then writes:<\/p>\n<blockquote lang=\"ar\" dir=\"rtl\"><p>اسْتِطْرَادٌ: إِنَّ سَادَاتِنَا آلَ بَاعَلَوِيٍّ — الَّذِينَ هَذَا الْفَاضِلُ مِنْهُمْ رَضِيَ اللَّهُ عَنْهُمْ — قَدْ أَجْمَعَتِ الْأُمَّةُ الْمُحَمَّدِيَّةُ فِي سَائِرِ الْأَعْصَارِ وَالْأَقْطَارِ عَلَى أَنَّهُمْ مِنْ أَصَحِّ أَهْلِ بَيْتِ النُّبُوَّةِ نَسَبًا، وَأَثْبَتِهِمْ حَسَبًا، وَأَكْثَرِهِمْ عِلْمًا وَعَمَلًا وَفَضْلًا وَأَدَبًا، وَهُمْ كُلُّهُمْ مِنْ أَهْلِ السُّنَّةِ وَالْجَمَاعَةِ عَلَى مَذْهَبِ إِمَامِنَا الشَّافِعِيِّ رَضِيَ اللَّهُ عَنْهُ، مَعَ كَثْرَتِهِمْ إِلَى دَرَجَةٍ لَا يَقِلُّونَ فِيهَا عَنْ مِائَةِ أَلْفِ إِنْسَانٍ، وَمَعَ مُجَاوَرَةِ بِلَادِهِمْ، وَهِيَ بِلَادُ حَضْرَمَوْتَ، إِلَى الزَّيْدِيَّةِ فِي الْيَمَنِ، وَمَعَ تَفَرُّقِهِمْ فِي سَائِرِ الْبِلَادِ وَلَا سِيَّمَا بِلَادُ الْهِنْدِ. أَمَّا عُلَمَاؤُهُمُ الْكِبَارُ وَأَوْلِيَاؤُهُمُ الْأَخْيَارُ، أَصْحَابُ الْأَنْوَارِ وَالْأَسْرَارِ، فِي هَذَا الْعَصْرِ وَمَا تَقَدَّمَهُ مِنَ الْأَعْصَارِ، فَهُمْ أَكْثَرُ وَأَنْوَرُ مِنْ نُجُومِ السَّمَاءِ، بِهِمْ يَحْصُلُ لِكُلِّ مَنِ اقْتَدَى بِهِمُ الِاهْتِدَاءُ، وَلَا يَمْتَرِي فِي صِحَّةِ نَسَبِهِمْ وَكَثْرَةِ فَضَائِلِهِمْ وَمَزَايَاهُمُ الَّتِي تَمَيَّزُوا بِهَا عَنِ الْأَنَامِ بِبَرَكَةِ جَدِّهِمْ عَلَيْهِ الصَّلَاةُ وَالسَّلَامُ إِلَّا مَنْ قَلَّ حَظُّهُ فِي الْإِسْلَامِ<\/p><\/blockquote>\n<blockquote><p>\"A digression: our masters the Āl Bā ʿAlawī — of whom this excellent man is one, may Allah be pleased with them — the Muḥammadan community, in all ages and lands, has agreed that they are among the soundest of the Ahl al-Bayt of the Prophethood in lineage, the most firmly established in descent [ḥasab], and the most abundant in knowledge, deed, virtue and refinement; that all of them are of Ahl al-Sunnah wa'l-Jamāʿah on the school of our imam al-Shāfiʿī, despite their numbers reaching a degree not below a hundred thousand people, despite the proximity of their land, Ḥaḍramawt, to the Zaydīs of Yemen, and despite their dispersal through all lands, especially India. As for their great scholars and their righteous saints, the possessors of lights and secrets, in this age and the ages before it, they are more numerous and more luminous than the stars of the sky; guidance is attained by everyone who follows them; and none doubts the soundness of their lineage and the abundance of their virtues and distinctions - by which they are distinguished from mankind by the blessing of their grandfather <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صلى الله عليه وسلم<\/span>, - except one whose portion of faith in Islam is miniscule.\"<\/p><\/blockquote>\n<p>He then adds a first-hand attestation, in the same digression: he had read some of their works and found them \"all guidance, polishing the rust from the heart\"; had met some of them and found in them virtues and noble character \"that fill the eyes with delight and the hearts with joy\"; and had corresponded with some and found in their letters gentleness, humility and beauty of expression \"such that a believer could not come to know it without loving its author deeply\" — and that whatever praise he gave them, \"it is less than what my heart holds for them of loyalty and belief in their perfection.\"<\/p>\n<p>What his statement establishes, is that a leading Shāfiʿī scholar and author outside Ḥaḍramawt, who had read their books, met some of them and corresponded with others, held them to be among the soundest of the Prophet's <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صلى الله عليه وسلم<\/span> descendants in lineage and among the most learned and devout, and Ash'ari in creed and Shāfiʿī in law.<\/p>\n<p><strong>Other independent testimonies:<\/strong> Dr. Muḥammad Abū Bakr Bādhīb, in praising the Ba Alawi Sadah also cites:<\/p>\n<ul><li>Murtaḍā al-Zabīdī, the most famous commentator on the Ihya Ulum al Din of Imam Ghazali in (al-Rawḍ) describing Aḥmad ibn ʿĪsā al-Naqīb \"al-Rūmī\" as \"the ancestor of this blessed lineage\"<\/li><\/ul>\n<ul><li>Ibn Ḥajar al-Haytamī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>, in an ijāzah said to be dated 942H, on the combination of sharīʿah and ḥaqīqah among them; in his own collection of chains of transmission (al-Masānid), listing his Sufi teachers, Ibn Ḥajar al-Haytamī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> — names Abū Bakr al-ʿAydarūs <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> among them and states, that the Bā ʿAlawī ṭarīqah is:<\/li><\/ul>\n<p>\"جليلة عالية المقدار\" (jalīlah ʿāliyat al-miqdār, \"a venerable path of lofty standing\"), and gives his own chain through it — ʿAbdullāh al-ʿAydarūs ← Abū Bakr al-ʿAydarūs ← ʿAbd al-Raḥmān al-Saqqāf ← Muḥammad ← ʿAlī ← ʿAlawī ← Muḥammad ← ʿAlī ← Muḥammad ← ʿAlī ← ʿAlawī ← Muḥammad ← ʿAlawī ← ʿUbaydillāh ← Aḥmad [al-Muhājir] ← ʿĪsā ← Muḥammad ← ʿAlī ← Jaʿfar al-Ṣādiq ← Muḥammad al-Bāqir ← Zayn al-ʿĀbidīn ← al-Ḥusayn ← ʿAlī ← the Messenger of Allah <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صلى الله عليه وسلم<\/span> — the identical chain already given above from al-Manhaj al-Sawī and ʿIqd al-Yawāqīt.<\/p>\n<ul><li>and Jaʿfar ibn Abī Bakr al-Labanī on their rigorous procedures for verifying their genealogies.<\/li><\/ul>\n<p>The same treatise sets out the formal juristic basis for accepting a documented sayyid lineage of this kind: a citation attributed to Ibn Rushd <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (\"there is no disagreement on this\") and to Imam Mālik <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (via Sīdī Khalīl's al-Tawḍīḥ and Ibn Khaldūn <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>) that people are to be believed about their own lineage; a named fatwā from Shaykh Ibrāhīm al-Riyāḥī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>, head of the Mālikī council of North Africa, on establishing noble lineage (sharaf) through samāʿ (received oral report) where it is unanimous and uncontested; and the listing of lineage (nasab) among the matters classical fiqh accepts as established by istifāḍah (widespread repute) alone, in both Ibn Ḥajar al-Haytamī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s own Tuḥfah and the Ḥanafī Radd al-Muḥtār, alongside death, waqf, marriage, and judicial appointment.<\/p>\n<p>Two further named historical fatwās are cited specifically endorsing the Bā ʿAlawī written genealogical register (shajarah) as reliable:<\/p>\n<ul><li>al-ʿAllāmah ʿAlī ibn ʿUmar al-ʿArshānī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> ruled that a judge, muftī, or witness may rely on the known Āl ʿAlawī shajarah for lineage testimony without requiring a full chain, treating it like istifāḍah;<\/li><li>and Sayyid Abū Bakr ibn Aḥmad Bāfaqīh <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>, asked whether one may rely on the shajarah authored by Shaykh ʿAbdullāh al-ʿAydarūs <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>, ruled yes — co-signed by two further named jurists — on the grounds that its compiler was a trustworthy scholar who spoke only with knowledge and proof.<\/li><\/ul>\n<p>The treatise also records a specific historical verification episode: during a period when the lineage connection was disputed, the sādah sent the ḥāfiẓ Sayyid al-Ḥasan ʿAlī ibn Zayn Ḥaydar to Iraq specifically to re-verify it with witnesses, after which — the treatise states — pilgrims from Ḥaḍramawt attested to it as well as was done earlier by the son of Al-Muhajir Ahmad bin Isa, Ubaydullah who went he went back to Makkah and Basra to collect testimonies and witnesses to their lineage when some detractors doubted the lineage of Al Muhajir Ahmad bin Isa after his arrival in Hadramwt.<\/p>\n<p>The fiqh maxim unanimously agreed upon is: al-nās muʾminūn ʿalā ansābihim (\"people are to be believed regarding their own lineages\" — the burden of proof falls on whoever disputes a lineage, failing which the objector himself becomes liable as a qādhif, a slanderer):<\/p>\n<blockquote lang=\"ar\" dir=\"rtl\"><p>إن أمة الإسلام أمة الإسناد، واختصت بهذه الصفة عن سائر الأمم، ونقل إلينا القرآن الكريم بالإسناد، ونقلت إلينا السنة المطهرة بالإسناد، وكذا التواريخ والأنساب والمغازي والسير؛ وإذا تركنا لكل شخص أن يطلق لسانه فيما ثبت سيتمادى بهم الأمر إلى تكذيب كثير من الأحكام الشرعية والحوادث التاريخية لكونها لم تعجبهم ولم توافق هواهم... وهو أن الناس مؤمنون على أنسابهم، فمن ثبت نسبه وطعن فيه غيره فعليه الإثبات بالبينة، وإلا يُعَدّ باعتباره قاذفاً<\/p><\/blockquote>\n<blockquote><p>\"The Muslim community is, [above all,] the community of 'chains of transmission' (isnād), a quality that distinguishes it from every other nation. The Noble Qurʾān was conveyed to us by isnād, the purified Sunnah was conveyed to us by isnād, and likewise history, genealogy, military campaigns, and biography (were conveyed by Isnad). If we allowed every person free rein to speak against what is [already] established, matters would proceed to denying many legal rulings and historical events, simply because it does not please them or suit their inclination... and [the governing principle is] that people are to be believed regarding their own lineages: whoever has an established lineage, and is impugned by another, the burden of proof by clear evidence falls on the objector — failing which he is to be reckoned a slanderer.\"<\/p><\/blockquote>\n<p>To be continued in sha Allah...<\/p>"}, {"slug": "2026-10-21-ba-alawi-sada-part-2-preface-and-origins", "title": "The Bā ʿAlawī Sāda: A Comprehensive History, Methodology, and Legacy (Part 2: Preface and Origins)", "date": "2026-10-07", "time": "20:19", "summary": "Why this study was written, and the first section: the descent of the Bā ʿAlawī sāda and the migration of Aḥmad ibn ʿĪsā al-Muhājir from Baṣrah to Ḥaḍramawt, with the primary sources quoted.", "rtl": false, "minutes": 10, "html": "<h3>Preface<\/h3>\n<p>Accusations of heterodoxy are sometimes made against the Bā ʿAlawī sāda — the Ḥusaynid sayyid family of Ḥaḍramawt, Yemen, from whom Ḥabīb ʿUmar bin Ḥafīẓ and the modern seminary of Dār al-Muṣṭafā descend — by people who, on the evidence of what they actually cite, appear never to have opened a single volume of the tradition's own history, read a single work by its founding Imams, traced a single chain of its transmission, or asked what its own scholars — across more than eleven centuries — have said about their own method, their own creed, and their own relationship to the Qur'ān and Sunnah. A judgement formed entirely from secondhand video clips and captioned stills, with no engagement with a tradition's primary literature, cannot distinguish an isolated local excess from a foundational teaching, because it never learns what the foundational teaching actually is.<\/p>\n<p>This document exists to correct that gap directly, from the tradition's own primary sources, catalogued above. The picture that emerges is not that of a fringe or syncretistic movement. It is a documented, continuously-transmitted, self-consciously orthodox Sunni scholarly and spiritual tradition — Ashʿarī in creed, Shāfiʿī in law, explicitly and repeatedly anchored to the Qur'ān and Sunnah, explicitly and repeatedly hostile to extremism in either direction — and one responsible, through eleven centuries of scholarship and missionary activity, for the spread of Islam across a very large part of the inhabited world, not least the Indian subcontinent, maritime Southeast Asia, and the East African coast.<\/p>\n<p>Nothing here is offered as an argument against any other legitimate school or path within Sunni Islam. It is offered as what it plainly is: an account, as detailed as the available primary literature allows, of who the Bā ʿAlawī sāda are, where they came from, what they teach, how they have lived, and what they have, as a matter of historical record, accomplished.<\/p>\n<hr>\n<h3>I. Origins: The Migration of Aḥmad ibn ʿĪsā al-Muhājir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/h3>\n<p>The Bā ʿAlawī sāda trace their descent, without interruption, to the Prophet <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صلى الله عليه وسلم<\/span> through his grandson <strong>al-Ḥusayn ibn ʿAlī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنه<\/span><\/strong>, and from him through six further named generations to their eponymous migrant ancestor. The full chain, as given identically in both <em>al-Manhaj al-Sawī<\/em> (p. 19) and <em>ʿIqd al-Yawāqīt<\/em> (Vol. 1, p. 10), is:<\/p>\n<p><strong>al-Ḥusayn ibn ʿAlī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنه<\/span> → ʿAlī Zayn al-ʿĀbidīn <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> → Muḥammad al-Bāqir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> → Jaʿfar al-Ṣādiq <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> → ʿAlī al-ʿUraydī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> → Muḥammad al-Naqīb <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> → ʿĪsā al-Naqīb <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> → Aḥmad ibn ʿĪsā, \"al-Muhājir ilā Allāh\" <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>.<\/strong><\/p>\n<p><em>ʿIqd al-Yawāqīt<\/em> (Vol. 1, p. 10) preserves this chain in still fuller form as the author's own ancestral line, and it is worth reproducing at length because it is the single clearest primary-source statement of how the entire family's nomenclature developed, generation by generation, from Aḥmad al-Muhājir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> down to the family's various later branch-names:<\/p>\n<ol><li><strong>al-Ḥusayn ibn ʿAlī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنه<\/span><\/strong> (&amp; Fāṭimah al-Zahrāʾ <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنها<\/span>)<\/li><li><strong>ʿAlī Zayn al-ʿĀbidīn <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong><\/li><li><strong>Muḥammad al-Bāqir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong><\/li><li><strong>Jaʿfar al-Ṣādiq <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong><\/li><li><strong>ʿAlī al-ʿUraydī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong><\/li><li><strong>Muḥammad al-Naqīb <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong><\/li><li><strong>ʿĪsā al-Naqīb <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong><\/li><li><strong>Aḥmad al-Muhājir ibn ʿĪsā <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong> (d. Ḥaḍramawt, after migrating in 317H)<\/li><li><strong>ʿUbaydillāh ibn Aḥmad al-Muhājir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong><\/li><li><strong>ʿAlawī ibn ʿUbaydillāh, \"Mawlā al-Ṣawmaʿah\" <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong> — the eponym from whom \"Banū ʿAlawī / Bā ʿAlawī\" takes its name<\/li><li><strong>Muḥammad ibn ʿAlawī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong><\/li><li><strong>ʿAlawī ibn Muḥammad, \"Ṣāḥib Bayt Jubayr\" <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong><\/li><li><strong>Muḥammad ibn ʿAlawī, \"Khāliʿ Qasam\" <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong><\/li><li><strong>ʿAlī ibn Muḥammad, \"Ṣāḥib Mirbāṭ\" <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong> (d. 556H)<\/li><li><strong>Muḥammad ibn ʿAlī — al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong> (d. 653H), the effective founder of the ṭarīqah, treated in full in Section II below.<\/li><\/ol>\n<p>Aḥmad ibn ʿĪsā al-Muhājir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s family seat was Baṣrah, in southern Iraq, where the Prophet's <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صلى الله عليه وسلم<\/span> household had traditionally enjoyed sanctity and protection. By the early fourth Islamic century, that protection had collapsed. <em>Al-Manhaj al-Sawī<\/em> (p. 19–20) records that as Abbasid authority weakened, Baṣrah was struck by repeated disasters — worst among them the Qarāmiṭah (Qarmatians), a violent millenarian faction who sacked the city at the start of the century, and the rising power of the Zanj faction. Facing this, and facing the spread of doctrinal innovation and sectarian dispute among the Muslims of Iraq more broadly, Aḥmad ibn ʿĪsā <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> made the decision that gave him his title:<\/p>\n<blockquote lang=\"ar\" dir=\"rtl\"><p>في تلك الظروف المضطربة التي لا يطيق الصالحون المتحامون عن الدنيا مثلها، في عام ٣١٧هـ بالتحديد، هاجر الإمام أحمد بن عيسى، الذي لُقّب لذلك بالمهاجر، فارّاً بدينه من تلك الفتن المائجة، تاركاً البصرة، في صحبة سبعين من أهله وأتباعه<\/p><\/blockquote>\n<blockquote><p>\"In those turbulent circumstances which righteous men who guard themselves from worldliness cannot endure, in the year 317H precisely, Imam Aḥmad ibn ʿĪsā migrated — for which he was titled 'al-Muhājir' — fleeing with his religion from that surging strife, leaving Baṣrah in the company of seventy of his family and followers.\" (<em>al-Manhaj al-Sawī<\/em>, p. 20)<\/p><\/blockquote>\n<p>Imam al-Ḥaddād <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> himself, writing some seven centuries later in <em>Risālat al-Muʿāwanah<\/em> (\"The Book of Assistance\"), gives the identical account in his own voice, naming the specific religious cause of the migration — not merely political instability, but the spread of theological error — and explicitly noting the family's subsequent freedom from the doctrinal deviation that afflicted other branches of the Prophet's <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صلى الله عليه وسلم<\/span> household:<\/p>\n<blockquote lang=\"ar\" dir=\"rtl\"><p>وكان الإمام المهاجر إلى الله جد السادة المذكورين سيدي أحمد بن عيسى بن محمد بن علي بن الإمام جعفر الصادق، لما رأى ظهور البدع وكثرة الأهواء واختلاف الآراء بالعراق هاجر منها... ولم يزل ينتقل في الأرض حتى أتى أرض حضرموت، فأقام بها إلى أن توفي، فبارك الله في عقبه حتى اشتهر منهم الجَمُّ الغفير بالعلم والعبادة والولاية والمعرفة، ولم يعرض لهم ما يعرض لجماعات من أهل البيت النبوي من انتحال البدع واتباع الأهواء المضلة ببركة هذا الإمام المؤتمن بدينه وفراره من مواضع الفتن<\/p><\/blockquote>\n<blockquote><p>\"The Imam who migrated to Allah, ancestor of the aforementioned sāda, was my master Aḥmad ibn ʿĪsā ibn Muḥammad ibn ʿAlī ibn al-Imām Jaʿfar al-Ṣādiq — when he saw the emergence of heretical innovations, the proliferation of factional desires, and the divergence of opinions in Iraq, he emigrated from it... and did not cease moving through the land until he reached the land of Ḥaḍramawt, where he settled until he died. Allah blessed his progeny until a great multitude of them became renowned for knowledge, worship, sainthood, and gnosis, and they were not afflicted with what afflicted [other] groups of the Prophetic Household — the embrace of innovations and the following of misguiding desires — owing to the trustworthiness of this Imam in his religion and his flight from places of tribulation.\" (<em>Risālat al-Muʿāwanah<\/em>, in <em>Silsilat Kutub al-Imām al-Ḥaddād<\/em> <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>, p. 68)<\/p><\/blockquote>\n<p>Two things in Imam al-Ḥaddād <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s own words deserve to be underlined, because they go directly to the \"authenticity\" question this document exists to answer. First, the migration is explicitly framed as flight from sectarian error, not toward it — Aḥmad al-Muhājir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> left Iraq precisely because it had become a place of bidʿah and factional dispute. Second, Imam al-Ḥaddād <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> — writing as a scholar fully aware that other branches of the Prophet's <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صلى الله عليه وسلم<\/span> household had, across Islamic history, fallen into doctrinal deviation — explicitly and pointedly states that the Bā ʿAlawī branch was spared that fate specifically \"by the blessing of this trustworthy Imam and his flight from places of tribulation.\" This is not incidental praise poetry; it is the tradition's own founding self-understanding, stated by its most authoritative later voice: that its origin lies in a conscious rejection of sectarian extremism, not an accommodation of it.<\/p>\n<p>The route of the migration, per <em>al-Manhaj al-Sawī<\/em> (p. 20) and corroborated in <em>ʿIqd al-Yawāqīt<\/em> (Vol. 1, pp. 213–214, citing the classical historian al-Shillī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s <em>al-Mashraʿ al-Rawī<\/em>), ran through the Ḥijāz — a year's residence at Madīnah, then Makkah, which he reached in the very year the Qarāmiṭah entered the city and tore the Black Stone from its place, independently confirming the 317H date — then across the Arabian desert via ʿAsīr and Yemen into Wādī Ḥaḍramawt. <em>ʿIqd al-Yawāqīt<\/em> adds a further, historically significant detail not present in <em>al-Manhaj al-Sawī<\/em>: that Ḥaḍramawt at the time of his arrival was under Ibāḍī (Khārijite) religious domination, and that Aḥmad al-Muhājir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> is credited, together with his immediate successors, with the region's restoration to mainstream Sunni Islam:<\/p>\n<blockquote lang=\"ar\" dir=\"rtl\"><p>وقبل قدومه كان استيلاء الإباضية بهذه الجهة، حتى طهّرها الله به من البدعة والضلالة بالحجة الصحيحة. ثم خلفه الإمام الكبير، الشيخ العالم سالم [بافضل]... ثم عزّزهما الأستاذ الأعظم الفقيه المقدّم، فقُدّس به ذلك الوادي، وأسّس على التقوى مسجد ذلك النادي، وأظهر فيه عقائد أهل السنة والجماعة، وأحيا العلوم على الصراط المستقيم<\/p><\/blockquote>\n<blockquote><p>\"Before his arrival, Ibāḍī domination held sway over this region, until Allah purified it through him from innovation and misguidance by sound proof. Then he was succeeded by the great Imam, the learned Shaykh Sālim [Bāfaḍl, d. 581H]... then the two of them were reinforced by the Greatest Teacher, al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>, and that valley was sanctified through him, and he founded upon piety the mosque of that gathering-place, and he manifested therein the creeds of Ahl al-Sunnah wa'l-Jamāʿah, and revived the [religious] sciences upon the straight path.\" (<em>ʿIqd al-Yawāqīt<\/em>, Vol. 1, p. 214)<\/p><\/blockquote>\n<p>This is, in other words, a primary-source claim — from the tradition's own classical historiography — that the Bā ʿAlawī sāda's founding role in Ḥaḍramawt was precisely the re-Sunnification of a region that had fallen under sectarian Khārijite control, achieved \"by sound proof,\" not by the sword.<\/p>\n<p>Independent corroboration from a non-Bā-ʿAlawī general history of Ḥaḍramawt (<em>al-Shāmil fī Tārīkh Ḥaḍramawt<\/em>, p. 246), under its own section heading, \"The emergence of the Khawārij in Ḥaḍramawt as the cause of its civilizational decline\": this general history states, independently of any Bā ʿAlawī source, that Khārijite control over the region, beginning in the early second Islamic century, cost Ḥaḍramawt more than two of the best three centuries of Islamic civilization, cutting it off from the wider Muslim world's learning and prosperity, and provoked repeated Umayyad and Abbasid military reprisals in response to Khārijite atrocities committed in the Ḥaramayn themselves. This independently corroborates, from outside the tradition and with added chronological precision, the <em>ʿIqd al-Yawāqīt<\/em> passage quoted above.<\/p>\n<p>Aḥmad al-Muhājir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> settled first at al-Hajarayn, then Qurā Kindah, and finally permanently at al-Ḥusayṣah, where he died in 345H. His son ʿUbaydullāh <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> had three sons — Baṣrī, Jadīd, and ʿAlawī — of whom only the line of ʿAlawī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> survived beyond the sixth Islamic century; every member of Āl Bā ʿAlawī living today descends from this one son.<\/p>\n<p>Fuller biographical detail on ʿUbaydullāh <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> himself (<em>Silsilat Aʿlām Ḥaḍramawt<\/em>, pp. 50–76): his mother's name is recorded as Umm al-Banīn bint Muḥammad ibn ʿĪsā ibn Muḥammad; the family's migration itself included a pilgrimage stop at Madīnah, where they visited the Prophet's <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صلى الله عليه وسلم<\/span> grave, the graves of the Mothers of the Believers, and the Companions' graves — the same source recording that pilgrims that year touched the empty place from which the Qarāmiṭah had torn the Black Stone, independently reinforcing the 317H dating already established above via the Qarāmiṭah's attack on Makkah; ʿUbaydullāh <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> himself later travelled again to the Ḥaramayn for further study and received formal authorization there to teach and issue fatwā; and he is recorded as having been named \"ʿAbdullāh\" at birth, adopting the diminutive \"ʿUbaydullāh\" himself, out of humility. His descendants relocated to Tarīm in 521H, first settled by Imam ʿAlawī ibn ʿUbaydillāh \"Khāliʿ Qasam\" <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (d. 529H;) affectionately called \"al-Ghannāʾ\" (The Richly Abundant) — has remained the tradition's spiritual capital for over nine centuries, honoured also for containing the graves of several Companions <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنهم<\/span> who died there during the Ridda Wars.<\/p>\n<hr>\n<h4>Before the migration: Tarīm in the age of the Companions — the Tarīmī tradition, with each claim placed at its true level of support<\/h4>\n<p>Ḥaḍramawt had a history in Islam long before Aḥmad ibn ʿĪsā <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> arrived, and Tarīm has its own traditions about it — about the riddah, about a duʿāʾ of Abū Bakr al-Ṣiddīq <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنه<\/span>, about Companions buried in its earth, and about the mosque called Masjid al-Ribāṭ. These are collected here because they are part of how Tarīm understands itself, and because Ḥabīb ʿUmar's teaching is delivered in that setting. But they are of very different evidentiary weight, and the account below keeps them apart:<\/p>\n<ol><li>the riddah in Ḥaḍramawt of which Tarim was the only city which did not renegade of their Islam, which is documented in the classical histories;<\/li><li>Tarīm's steadfastness and Abū Bakr <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنه<\/span>'s duʿāʾ, which the earliest Ḥaḍramī source transmits<\/li><li>the Sahabah's graves amongst them 70 of those who partook in the Battle of Badr in same graveyard where every Ba Alawi Sayyid in Tarim since 512AH is laid to rest<\/li><li>Masjid al-Ribāṭ named such because it was where the Sahabah tied (rabata) their camels on arriving in the city<\/li><\/ol>\n<p>To continue in part 3 insha Allah…<\/p>"}, {"slug": "2026-10-21-ba-alawi-sada-part-1-contents", "title": "The Bā ʿAlawī Sāda: A Comprehensive History, Methodology, and Legacy (Part 1: Contents)", "date": "2026-10-01", "time": "09:00", "summary": "The table of contents of the study of the Bā ʿAlawī sāda: sixteen sections from their origins and methodology to their spread across the world and their institutions today.", "rtl": false, "minutes": 2, "html": "<h3>Table of Contents<\/h3>\n<p><strong>Preface<\/strong><\/p>\n<p><strong>I.<\/strong> Origins: The Migration of Aḥmad ibn ʿĪsā al-Muhājir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/p>\n<ul><li>Before the migration: Tarīm in the age of the Companions — the Tarīmī tradition<\/li><li>Independent testimony to the lineage and rank of the Bā ʿAlawī — including Imām Yūsuf al-Nabhānī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/li><li>A Millennial scholarly legacy tradition established 1000 years before later reformist currents even existed<\/li><\/ul>\n<p><strong>II.<\/strong> The Founding of the Ṭarīqah: al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (574–653H)<\/p>\n<p><strong>III.<\/strong> The Great Imams Across the Centuries<\/p>\n<ul><li>Further imams of the chain<\/li><li>Further source for the generation-by-generation chain<\/li><\/ul>\n<p><strong>IV.<\/strong> Their Methodology (Manhaj): Five States, and the Fusion of Sharīʿah with Ḥaqīqah<\/p>\n<p><strong>V.<\/strong> Explicit Creed and Legal School: Ashʿarī and Māturīdī in Theology, Shāfiʿī in Law<\/p>\n<p><strong>VI.<\/strong> Moderation, and the Explicit Rejection of Extremism<\/p>\n<ul><li>A formal fatwā-collection statement on the discipline of restraint from takfīr<\/li><\/ul>\n<p><strong>VII.<\/strong> Mastery of Qur'ān, Ḥadīth, Fiqh, and Kalām<\/p>\n<p><strong>VIII.<\/strong> Piety Without Ostentation: Humility, Self-Criticism, and the Discipline Against Relying on Lineage<\/p>\n<p><strong>IX.<\/strong> Karāmāt and the Discipline Against Seeking Them<\/p>\n<ul><li>A formal legal taxonomy: karāmah, istidrāj, and sorcery distinguished<\/li><li>Imam Al-Ḥaddād <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s own definition of hidden shirk, and his own doctrine of karāmah as subordinate to, never equal to, Prophetic proof<\/li><\/ul>\n<p><strong>X.<\/strong> Imam ʿAbdullāh ibn ʿAlawī al-Ḥaddād <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (1044–1132H): The Tradition's Central Later Figure<\/p>\n<p><strong>XI.<\/strong> The Global Spread of Islam Through the Bā ʿAlawī Sāda: India, East Africa, and the Malay World<\/p>\n<ul><li>The tradition's own account of its spread, in its own words<\/li><\/ul>\n<p><strong>XII.<\/strong> Islam in Southern Africa: Shaykh Yūsuf al-Makassarī, Tuan Guru, and the Cape Karamat Tradition<\/p>\n<ul><li>The two founding figures<\/li><li>What is firmly documented: the Alawiyyah order's Cape footprint<\/li><\/ul>\n<p><strong>XIII.<\/strong> The Rātib al-Ḥaddād: A Living Legacy, in Full 85<\/p>\n<p><strong>XIV.<\/strong> The Living Tradition: Contemporary Bā ʿAlawī Teaching in Its Own Words<\/p>\n<ul><li>Ḥabīb ʿUmar bin Ḥafīẓ's own books talks and lectures<\/li><li>Ḥabīb ʿUmar bin Ḥafīẓ on takfīr, karāmāt, and religious extremism: Mamlakat al-Qalb wa'l-Aʿḍāʾ (\"The Kingdom of the Heart and the Limbs\")<\/li><\/ul>\n<p><strong>XV.<\/strong> The Institutional Present: Ribāṭ Tarīm and Dār al-Muṣṭafā<\/p>\n<p><strong>XVI.<\/strong> Conclusion<\/p>"}];
const view = document.getElementById("view");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = d => { const t = new Date(d + "T12:00:00"); return isNaN(t) ? d : t.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }); };
const dirAttr = p => p.rtl ? ' lang="ar" dir="rtl"' : "";
let query = "";
const ROOT = location.pathname.replace(/a\/[^/]*\/?$/, "").replace(/index\.html$/, "");
const postUrl = p => location.origin + ROOT + "a/" + p.slug + "/";
document.querySelectorAll('a[href="#home"]').forEach(a => a.href = ROOT + "#home");

function home() {
  document.title = "Maḥw al-Rusūm";
  const n = POSTS.length;
  view.innerHTML = `
    <section class="intro">
      <p class="kicker">${n ? n + (n === 1 ? " article" : " articles") : "New site"}</p>
      <h1>Maḥw al-Rusūm</h1>
      <p class="ar-title" lang="ar" dir="rtl">محو الرسوم</p>
      <p>Short articles and notes, newest first.</p>
    </section>
    ${n ? `<div class="search"><label for="q">Search the articles</label>
      <input id="q" type="search" placeholder="Title or word" value="${esc(query)}"></div>
      <ul class="list" id="list"></ul>`
    : `<div class="empty"><h2>The first article is on its way</h2><p>New articles will be listed here, newest first.</p></div>`}`;
  if (!n) return;
  const q = document.getElementById("q");
  q.addEventListener("input", () => { query = q.value; renderList(); });
  renderList();
}

function renderList() {
  const q = query.trim().toLowerCase();
  const hits = POSTS.filter(p => !q || (p.title + " " + p.summary + " " + p.html).toLowerCase().includes(q));
  document.getElementById("list").innerHTML = hits.length ? hits.map(p => `
    <li><a href="${ROOT}#${p.slug}"${dirAttr(p)}>
      <span class="meta" dir="ltr">${fmt(p.date)} · ${p.minutes} min read</span>
      <span class="t">${esc(p.title)}</span>
      <span class="s">${esc(p.summary)}</span>
    </a></li>`).join("") : `<li><p class="meta" style="padding-block:20px">No article matches “${esc(query)}”.</p></li>`;
}

function article(i) {
  const p = POSTS[i], newer = POSTS[i - 1], older = POSTS[i + 1];
  document.title = p.title + " · Maḥw al-Rusūm";
  view.innerHTML = `
    <a class="back" href="${ROOT}#home">← All articles</a>
    <article${dirAttr(p)}>
      <header><h1>${esc(p.title)}</h1><p class="meta" dir="ltr">${fmt(p.date)} · ${p.minutes} min read</p></header>
      <div class="share" role="group" aria-label="Share this article"><span class="lbl">Share</span>
        <button type="button" class="main" id="sh-native">Share…</button>
        <a href="https://wa.me/?text=${encodeURIComponent(p.title + "\n" + postUrl(p))}" target="_blank" rel="noopener">WhatsApp</a>
        <a href="https://t.me/share/url?url=${encodeURIComponent(postUrl(p))}&text=${encodeURIComponent(p.title)}" target="_blank" rel="noopener">Telegram</a>
        <a href="https://twitter.com/intent/tweet?url=${encodeURIComponent(postUrl(p))}&text=${encodeURIComponent(p.title)}" target="_blank" rel="noopener">X</a>
        <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(postUrl(p))}" target="_blank" rel="noopener">Facebook</a>
        <a href="mailto:?subject=${encodeURIComponent(p.title)}&body=${encodeURIComponent(p.title + "\n" + postUrl(p))}">Email</a>
        <button type="button" id="sh-copy">Copy link</button></div>
      <div class="body">${p.html}</div>
    </article>
    <nav class="pager">
      ${older ? `<a href="${ROOT}#${older.slug}"><span class="lbl">← Older</span><span>${esc(older.title)}</span></a>` : ""}
      ${newer ? `<a class="next" href="${ROOT}#${newer.slug}"><span class="lbl">Newer →</span><span>${esc(newer.title)}</span></a>` : ""}
    </nav>`;
  const url = postUrl(p);
  document.getElementById("sh-native").onclick = () => shareOut({ title: p.title, text: p.title, url });
  document.getElementById("sh-copy").onclick = () => copyOut(url, "Link copied");
  if (!navigator.share) document.getElementById("sh-native").hidden = true;
  window.scrollTo(0, 0);
}

function toast(m) { const d = document.createElement("div"); d.className = "share-toast"; d.setAttribute("role", "status"); d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 2200); }
function copyOut(text, msg) {
  const done = () => toast(msg);
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => toast("Could not copy"));
  else { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); done(); } catch (e) { toast("Could not copy"); } t.remove(); }
}
async function shareOut(d) { try { await navigator.share(d); } catch (e) { if (e.name !== "AbortError") copyOut((d.text ? d.text + "\n" : "") + d.url, "Copied"); } }

/* Share a selected passage: a bar appears at the bottom while text inside the article is selected. */
let selbar = null;
document.addEventListener("selectionchange", () => {
  const s = window.getSelection(), txt = s ? s.toString().trim() : "";
  const inArt = s && s.rangeCount && s.anchorNode && (s.anchorNode.parentElement || {}).closest && s.anchorNode.parentElement.closest(".body");
  if (!txt || !inArt) { if (selbar) { selbar.remove(); selbar = null; } return; }
  const i = POSTS.findIndex(p => p.slug === currentSlug()); if (i < 0) return;
  const p = POSTS[i], quote = "“" + txt.replace(/\s+/g, " ").slice(0, 1500) + "”\n— " + p.title, url = postUrl(p);
  if (!selbar) { selbar = document.createElement("div"); selbar.className = "selbar"; document.body.appendChild(selbar); }
  selbar.innerHTML = (navigator.share ? '<button type="button" id="sb-share">Share this passage</button>' : '') +
    '<button type="button" class="alt" id="sb-copy">Copy with link</button>' +
    '<a style="align-self:center;font-size:14px" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(quote + "\n" + url) + '">WhatsApp</a>';
  const sh = selbar.querySelector("#sb-share"); if (sh) sh.onclick = () => shareOut({ title: p.title, text: quote, url });
  selbar.querySelector("#sb-copy").onclick = () => copyOut(quote + "\n" + url, "Passage copied with link");
});

function currentSlug() { const m = location.pathname.match(/\/a\/([^/]+)\/?$/); return location.hash.slice(1) || (m ? m[1] : ""); }
function route() {
  const h = currentSlug();
  const i = POSTS.findIndex(p => p.slug === h);
  i >= 0 ? article(i) : home();
}
window.addEventListener("hashchange", route);
route();
</script>
