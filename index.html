<script>
const POSTS = [{"slug": "2026-10-21-ba-alawi-sada-part-2-preface-and-origins", "title": "The Bā ʿAlawī Sāda: A Comprehensive History, Methodology, and Legacy (Part 2: Preface and Origins)", "date": "2026-10-07", "time": "20:19", "summary": "Why this study was written, and the first section: the descent of the Bā ʿAlawī sāda and the migration of Aḥmad ibn ʿĪsā al-Muhājir from Baṣrah to Ḥaḍramawt, with the primary sources quoted.", "rtl": false, "minutes": 10, "html": "<h3>Preface<\/h3>\n<p>Accusations of heterodoxy are sometimes made against the Bā ʿAlawī sāda — the Ḥusaynid sayyid family of Ḥaḍramawt, Yemen, from whom Ḥabīb ʿUmar bin Ḥafīẓ and the modern seminary of Dār al-Muṣṭafā descend — by people who, on the evidence of what they actually cite, appear never to have opened a single volume of the tradition's own history, read a single work by its founding Imams, traced a single chain of its transmission, or asked what its own scholars — across more than eleven centuries — have said about their own method, their own creed, and their own relationship to the Qur'ān and Sunnah. A judgement formed entirely from secondhand video clips and captioned stills, with no engagement with a tradition's primary literature, cannot distinguish an isolated local excess from a foundational teaching, because it never learns what the foundational teaching actually is.<\/p>\n<p>This document exists to correct that gap directly, from the tradition's own primary sources, catalogued above. The picture that emerges is not that of a fringe or syncretistic movement. It is a documented, continuously-transmitted, self-consciously orthodox Sunni scholarly and spiritual tradition — Ashʿarī in creed, Shāfiʿī in law, explicitly and repeatedly anchored to the Qur'ān and Sunnah, explicitly and repeatedly hostile to extremism in either direction — and one responsible, through eleven centuries of scholarship and missionary activity, for the spread of Islam across a very large part of the inhabited world, not least the Indian subcontinent, maritime Southeast Asia, and the East African coast.<\/p>\n<p>Nothing here is offered as an argument against any other legitimate school or path within Sunni Islam. It is offered as what it plainly is: an account, as detailed as the available primary literature allows, of who the Bā ʿAlawī sāda are, where they came from, what they teach, how they have lived, and what they have, as a matter of historical record, accomplished.<\/p>\n<hr>\n<h3>I. Origins: The Migration of Aḥmad ibn ʿĪsā al-Muhājir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/h3>\n<p>The Bā ʿAlawī sāda trace their descent, without interruption, to the Prophet <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صلى الله عليه وسلم<\/span> through his grandson <strong>al-Ḥusayn ibn ʿAlī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنه<\/span><\/strong>, and from him through six further named generations to their eponymous migrant ancestor. The full chain, as given identically in both <em>al-Manhaj al-Sawī<\/em> (p. 19) and <em>ʿIqd al-Yawāqīt<\/em> (Vol. 1, p. 10), is:<\/p>\n<p><strong>al-Ḥusayn ibn ʿAlī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنه<\/span> → ʿAlī Zayn al-ʿĀbidīn <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> → Muḥammad al-Bāqir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> → Jaʿfar al-Ṣādiq <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> → ʿAlī al-ʿUraydī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> → Muḥammad al-Naqīb <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> → ʿĪsā al-Naqīb <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> → Aḥmad ibn ʿĪsā, \"al-Muhājir ilā Allāh\" <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>.<\/strong><\/p>\n<p><em>ʿIqd al-Yawāqīt<\/em> (Vol. 1, p. 10) preserves this chain in still fuller form as the author's own ancestral line, and it is worth reproducing at length because it is the single clearest primary-source statement of how the entire family's nomenclature developed, generation by generation, from Aḥmad al-Muhājir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> down to the family's various later branch-names:<\/p>\n<ol><li><strong>al-Ḥusayn ibn ʿAlī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنه<\/span><\/strong> (&amp; Fāṭimah al-Zahrāʾ <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنها<\/span>)<\/li><li><strong>ʿAlī Zayn al-ʿĀbidīn <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong><\/li><li><strong>Muḥammad al-Bāqir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong><\/li><li><strong>Jaʿfar al-Ṣādiq <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong><\/li><li><strong>ʿAlī al-ʿUraydī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong><\/li><li><strong>Muḥammad al-Naqīb <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong><\/li><li><strong>ʿĪsā al-Naqīb <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong><\/li><li><strong>Aḥmad al-Muhājir ibn ʿĪsā <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong> (d. Ḥaḍramawt, after migrating in 317H)<\/li><li><strong>ʿUbaydillāh ibn Aḥmad al-Muhājir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong><\/li><li><strong>ʿAlawī ibn ʿUbaydillāh, \"Mawlā al-Ṣawmaʿah\" <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong> — the eponym from whom \"Banū ʿAlawī / Bā ʿAlawī\" takes its name<\/li><li><strong>Muḥammad ibn ʿAlawī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong><\/li><li><strong>ʿAlawī ibn Muḥammad, \"Ṣāḥib Bayt Jubayr\" <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong><\/li><li><strong>Muḥammad ibn ʿAlawī, \"Khāliʿ Qasam\" <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong><\/li><li><strong>ʿAlī ibn Muḥammad, \"Ṣāḥib Mirbāṭ\" <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong> (d. 556H)<\/li><li><strong>Muḥammad ibn ʿAlī — al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/strong> (d. 653H), the effective founder of the ṭarīqah, treated in full in Section II below.<\/li><\/ol>\n<p>Aḥmad ibn ʿĪsā al-Muhājir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s family seat was Baṣrah, in southern Iraq, where the Prophet's <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صلى الله عليه وسلم<\/span> household had traditionally enjoyed sanctity and protection. By the early fourth Islamic century, that protection had collapsed. <em>Al-Manhaj al-Sawī<\/em> (p. 19–20) records that as Abbasid authority weakened, Baṣrah was struck by repeated disasters — worst among them the Qarāmiṭah (Qarmatians), a violent millenarian faction who sacked the city at the start of the century, and the rising power of the Zanj faction. Facing this, and facing the spread of doctrinal innovation and sectarian dispute among the Muslims of Iraq more broadly, Aḥmad ibn ʿĪsā <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> made the decision that gave him his title:<\/p>\n<blockquote lang=\"ar\" dir=\"rtl\"><p>في تلك الظروف المضطربة التي لا يطيق الصالحون المتحامون عن الدنيا مثلها، في عام ٣١٧هـ بالتحديد، هاجر الإمام أحمد بن عيسى، الذي لُقّب لذلك بالمهاجر، فارّاً بدينه من تلك الفتن المائجة، تاركاً البصرة، في صحبة سبعين من أهله وأتباعه<\/p><\/blockquote>\n<blockquote><p>\"In those turbulent circumstances which righteous men who guard themselves from worldliness cannot endure, in the year 317H precisely, Imam Aḥmad ibn ʿĪsā migrated — for which he was titled 'al-Muhājir' — fleeing with his religion from that surging strife, leaving Baṣrah in the company of seventy of his family and followers.\" (<em>al-Manhaj al-Sawī<\/em>, p. 20)<\/p><\/blockquote>\n<p>Imam al-Ḥaddād <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> himself, writing some seven centuries later in <em>Risālat al-Muʿāwanah<\/em> (\"The Book of Assistance\"), gives the identical account in his own voice, naming the specific religious cause of the migration — not merely political instability, but the spread of theological error — and explicitly noting the family's subsequent freedom from the doctrinal deviation that afflicted other branches of the Prophet's <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صلى الله عليه وسلم<\/span> household:<\/p>\n<blockquote lang=\"ar\" dir=\"rtl\"><p>وكان الإمام المهاجر إلى الله جد السادة المذكورين سيدي أحمد بن عيسى بن محمد بن علي بن الإمام جعفر الصادق، لما رأى ظهور البدع وكثرة الأهواء واختلاف الآراء بالعراق هاجر منها... ولم يزل ينتقل في الأرض حتى أتى أرض حضرموت، فأقام بها إلى أن توفي، فبارك الله في عقبه حتى اشتهر منهم الجَمُّ الغفير بالعلم والعبادة والولاية والمعرفة، ولم يعرض لهم ما يعرض لجماعات من أهل البيت النبوي من انتحال البدع واتباع الأهواء المضلة ببركة هذا الإمام المؤتمن بدينه وفراره من مواضع الفتن<\/p><\/blockquote>\n<blockquote><p>\"The Imam who migrated to Allah, ancestor of the aforementioned sāda, was my master Aḥmad ibn ʿĪsā ibn Muḥammad ibn ʿAlī ibn al-Imām Jaʿfar al-Ṣādiq — when he saw the emergence of heretical innovations, the proliferation of factional desires, and the divergence of opinions in Iraq, he emigrated from it... and did not cease moving through the land until he reached the land of Ḥaḍramawt, where he settled until he died. Allah blessed his progeny until a great multitude of them became renowned for knowledge, worship, sainthood, and gnosis, and they were not afflicted with what afflicted [other] groups of the Prophetic Household — the embrace of innovations and the following of misguiding desires — owing to the trustworthiness of this Imam in his religion and his flight from places of tribulation.\" (<em>Risālat al-Muʿāwanah<\/em>, in <em>Silsilat Kutub al-Imām al-Ḥaddād<\/em> <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>, p. 68)<\/p><\/blockquote>\n<p>Two things in Imam al-Ḥaddād <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s own words deserve to be underlined, because they go directly to the \"authenticity\" question this document exists to answer. First, the migration is explicitly framed as flight from sectarian error, not toward it — Aḥmad al-Muhājir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> left Iraq precisely because it had become a place of bidʿah and factional dispute. Second, Imam al-Ḥaddād <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> — writing as a scholar fully aware that other branches of the Prophet's <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صلى الله عليه وسلم<\/span> household had, across Islamic history, fallen into doctrinal deviation — explicitly and pointedly states that the Bā ʿAlawī branch was spared that fate specifically \"by the blessing of this trustworthy Imam and his flight from places of tribulation.\" This is not incidental praise poetry; it is the tradition's own founding self-understanding, stated by its most authoritative later voice: that its origin lies in a conscious rejection of sectarian extremism, not an accommodation of it.<\/p>\n<p>The route of the migration, per <em>al-Manhaj al-Sawī<\/em> (p. 20) and corroborated in <em>ʿIqd al-Yawāqīt<\/em> (Vol. 1, pp. 213–214, citing the classical historian al-Shillī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s <em>al-Mashraʿ al-Rawī<\/em>), ran through the Ḥijāz — a year's residence at Madīnah, then Makkah, which he reached in the very year the Qarāmiṭah entered the city and tore the Black Stone from its place, independently confirming the 317H date — then across the Arabian desert via ʿAsīr and Yemen into Wādī Ḥaḍramawt. <em>ʿIqd al-Yawāqīt<\/em> adds a further, historically significant detail not present in <em>al-Manhaj al-Sawī<\/em>: that Ḥaḍramawt at the time of his arrival was under Ibāḍī (Khārijite) religious domination, and that Aḥmad al-Muhājir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> is credited, together with his immediate successors, with the region's restoration to mainstream Sunni Islam:<\/p>\n<blockquote lang=\"ar\" dir=\"rtl\"><p>وقبل قدومه كان استيلاء الإباضية بهذه الجهة، حتى طهّرها الله به من البدعة والضلالة بالحجة الصحيحة. ثم خلفه الإمام الكبير، الشيخ العالم سالم [بافضل]... ثم عزّزهما الأستاذ الأعظم الفقيه المقدّم، فقُدّس به ذلك الوادي، وأسّس على التقوى مسجد ذلك النادي، وأظهر فيه عقائد أهل السنة والجماعة، وأحيا العلوم على الصراط المستقيم<\/p><\/blockquote>\n<blockquote><p>\"Before his arrival, Ibāḍī domination held sway over this region, until Allah purified it through him from innovation and misguidance by sound proof. Then he was succeeded by the great Imam, the learned Shaykh Sālim [Bāfaḍl, d. 581H]... then the two of them were reinforced by the Greatest Teacher, al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>, and that valley was sanctified through him, and he founded upon piety the mosque of that gathering-place, and he manifested therein the creeds of Ahl al-Sunnah wa'l-Jamāʿah, and revived the [religious] sciences upon the straight path.\" (<em>ʿIqd al-Yawāqīt<\/em>, Vol. 1, p. 214)<\/p><\/blockquote>\n<p>This is, in other words, a primary-source claim — from the tradition's own classical historiography — that the Bā ʿAlawī sāda's founding role in Ḥaḍramawt was precisely the re-Sunnification of a region that had fallen under sectarian Khārijite control, achieved \"by sound proof,\" not by the sword.<\/p>\n<p>Independent corroboration from a non-Bā-ʿAlawī general history of Ḥaḍramawt (<em>al-Shāmil fī Tārīkh Ḥaḍramawt<\/em>, p. 246), under its own section heading, \"The emergence of the Khawārij in Ḥaḍramawt as the cause of its civilizational decline\": this general history states, independently of any Bā ʿAlawī source, that Khārijite control over the region, beginning in the early second Islamic century, cost Ḥaḍramawt more than two of the best three centuries of Islamic civilization, cutting it off from the wider Muslim world's learning and prosperity, and provoked repeated Umayyad and Abbasid military reprisals in response to Khārijite atrocities committed in the Ḥaramayn themselves. This independently corroborates, from outside the tradition and with added chronological precision, the <em>ʿIqd al-Yawāqīt<\/em> passage quoted above.<\/p>\n<p>Aḥmad al-Muhājir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> settled first at al-Hajarayn, then Qurā Kindah, and finally permanently at al-Ḥusayṣah, where he died in 345H. His son ʿUbaydullāh <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> had three sons — Baṣrī, Jadīd, and ʿAlawī — of whom only the line of ʿAlawī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> survived beyond the sixth Islamic century; every member of Āl Bā ʿAlawī living today descends from this one son.<\/p>\n<p>Fuller biographical detail on ʿUbaydullāh <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> himself (<em>Silsilat Aʿlām Ḥaḍramawt<\/em>, pp. 50–76): his mother's name is recorded as Umm al-Banīn bint Muḥammad ibn ʿĪsā ibn Muḥammad; the family's migration itself included a pilgrimage stop at Madīnah, where they visited the Prophet's <span class=\"hon\" lang=\"ar\" dir=\"rtl\">صلى الله عليه وسلم<\/span> grave, the graves of the Mothers of the Believers, and the Companions' graves — the same source recording that pilgrims that year touched the empty place from which the Qarāmiṭah had torn the Black Stone, independently reinforcing the 317H dating already established above via the Qarāmiṭah's attack on Makkah; ʿUbaydullāh <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> himself later travelled again to the Ḥaramayn for further study and received formal authorization there to teach and issue fatwā; and he is recorded as having been named \"ʿAbdullāh\" at birth, adopting the diminutive \"ʿUbaydullāh\" himself, out of humility. His descendants relocated to Tarīm in 521H, first settled by Imam ʿAlawī ibn ʿUbaydillāh \"Khāliʿ Qasam\" <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (d. 529H;) affectionately called \"al-Ghannāʾ\" (The Richly Abundant) — has remained the tradition's spiritual capital for over nine centuries, honoured also for containing the graves of several Companions <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنهم<\/span> who died there during the Ridda Wars.<\/p>\n<hr>\n<h4>Before the migration: Tarīm in the age of the Companions — the Tarīmī tradition, with each claim placed at its true level of support<\/h4>\n<p>Ḥaḍramawt had a history in Islam long before Aḥmad ibn ʿĪsā <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> arrived, and Tarīm has its own traditions about it — about the riddah, about a duʿāʾ of Abū Bakr al-Ṣiddīq <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنه<\/span>, about Companions buried in its earth, and about the mosque called Masjid al-Ribāṭ. These are collected here because they are part of how Tarīm understands itself, and because Ḥabīb ʿUmar's teaching is delivered in that setting. But they are of very different evidentiary weight, and the account below keeps them apart:<\/p>\n<ol><li>the riddah in Ḥaḍramawt of which Tarim was the only city which did not renegade of their Islam, which is documented in the classical histories;<\/li><li>Tarīm's steadfastness and Abū Bakr <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رضي الله عنه<\/span>'s duʿāʾ, which the earliest Ḥaḍramī source transmits<\/li><li>the Sahabah's graves amongst them 70 of those who partook in the Battle of Badr in same graveyard where every Ba Alawi Sayyid in Tarim since 512AH is laid to rest<\/li><li>Masjid al-Ribāṭ named such because it was where the Sahabah tied (rabata) their camels on arriving in the city<\/li><\/ol>\n<p>To continue in part 3 insha Allah…<\/p>"}, {"slug": "2026-10-21-ba-alawi-sada-part-1-contents", "title": "The Bā ʿAlawī Sāda: A Comprehensive History, Methodology, and Legacy (Part 1: Contents)", "date": "2026-10-01", "time": "09:00", "summary": "The table of contents of the study of the Bā ʿAlawī sāda: sixteen sections from their origins and methodology to their spread across the world and their institutions today.", "rtl": false, "minutes": 2, "html": "<h3>Table of Contents<\/h3>\n<p><strong>Preface<\/strong><\/p>\n<p><strong>I.<\/strong> Origins: The Migration of Aḥmad ibn ʿĪsā al-Muhājir <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/p>\n<ul><li>Before the migration: Tarīm in the age of the Companions — the Tarīmī tradition<\/li><li>Independent testimony to the lineage and rank of the Bā ʿAlawī — including Imām Yūsuf al-Nabhānī <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span><\/li><li>A Millennial scholarly legacy tradition established 1000 years before later reformist currents even existed<\/li><\/ul>\n<p><strong>II.<\/strong> The Founding of the Ṭarīqah: al-Faqīh al-Muqaddam <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (574–653H)<\/p>\n<p><strong>III.<\/strong> The Great Imams Across the Centuries<\/p>\n<ul><li>Further imams of the chain<\/li><li>Further source for the generation-by-generation chain<\/li><\/ul>\n<p><strong>IV.<\/strong> Their Methodology (Manhaj): Five States, and the Fusion of Sharīʿah with Ḥaqīqah<\/p>\n<p><strong>V.<\/strong> Explicit Creed and Legal School: Ashʿarī and Māturīdī in Theology, Shāfiʿī in Law<\/p>\n<p><strong>VI.<\/strong> Moderation, and the Explicit Rejection of Extremism<\/p>\n<ul><li>A formal fatwā-collection statement on the discipline of restraint from takfīr<\/li><\/ul>\n<p><strong>VII.<\/strong> Mastery of Qur'ān, Ḥadīth, Fiqh, and Kalām<\/p>\n<p><strong>VIII.<\/strong> Piety Without Ostentation: Humility, Self-Criticism, and the Discipline Against Relying on Lineage<\/p>\n<p><strong>IX.<\/strong> Karāmāt and the Discipline Against Seeking Them<\/p>\n<ul><li>A formal legal taxonomy: karāmah, istidrāj, and sorcery distinguished<\/li><li>Imam Al-Ḥaddād <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span>'s own definition of hidden shirk, and his own doctrine of karāmah as subordinate to, never equal to, Prophetic proof<\/li><\/ul>\n<p><strong>X.<\/strong> Imam ʿAbdullāh ibn ʿAlawī al-Ḥaddād <span class=\"hon\" lang=\"ar\" dir=\"rtl\">رحمه الله<\/span> (1044–1132H): The Tradition's Central Later Figure<\/p>\n<p><strong>XI.<\/strong> The Global Spread of Islam Through the Bā ʿAlawī Sāda: India, East Africa, and the Malay World<\/p>\n<ul><li>The tradition's own account of its spread, in its own words<\/li><\/ul>\n<p><strong>XII.<\/strong> Islam in Southern Africa: Shaykh Yūsuf al-Makassarī, Tuan Guru, and the Cape Karamat Tradition<\/p>\n<ul><li>The two founding figures<\/li><li>What is firmly documented: the Alawiyyah order's Cape footprint<\/li><\/ul>\n<p><strong>XIII.<\/strong> The Rātib al-Ḥaddād: A Living Legacy, in Full 85<\/p>\n<p><strong>XIV.<\/strong> The Living Tradition: Contemporary Bā ʿAlawī Teaching in Its Own Words<\/p>\n<ul><li>Ḥabīb ʿUmar bin Ḥafīẓ's own books talks and lectures<\/li><li>Ḥabīb ʿUmar bin Ḥafīẓ on takfīr, karāmāt, and religious extremism: Mamlakat al-Qalb wa'l-Aʿḍāʾ (\"The Kingdom of the Heart and the Limbs\")<\/li><\/ul>\n<p><strong>XV.<\/strong> The Institutional Present: Ribāṭ Tarīm and Dār al-Muṣṭafā<\/p>\n<p><strong>XVI.<\/strong> Conclusion<\/p>"}];
const view = document.getElementById("view");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = d => { const t = new Date(d + "T12:00:00"); return isNaN(t) ? d : t.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }); };
const dirAttr = p => p.rtl ? ' lang="ar" dir="rtl"' : "";
let query = "";

function home() {
  document.title = "Maḥw al-Rusūm";
  const n = POSTS.length;
  view.innerHTML = `
    <section class="intro">
      <p class="kicker">${n ? n + (n === 1 ? " article" : " articles") : "New site"}</p>
      <h1>Maḥw al-Rusūm</h1>
      <p class="ar-title" lang="ar" dir="rtl">محو الرسوم</p>
      <p>Short articles and notes, newest first.</p>
    </section>
    ${n ? `<div class="search"><label for="q">Search the articles</label>
      <input id="q" type="search" placeholder="Title or word" value="${esc(query)}"></div>
      <ul class="list" id="list"></ul>`
    : `<div class="empty"><h2>The first article is on its way</h2><p>New articles will be listed here, newest first.</p></div>`}`;
  if (!n) return;
  const q = document.getElementById("q");
  q.addEventListener("input", () => { query = q.value; renderList(); });
  renderList();
}

function renderList() {
  const q = query.trim().toLowerCase();
  const hits = POSTS.filter(p => !q || (p.title + " " + p.summary + " " + p.html).toLowerCase().includes(q));
  document.getElementById("list").innerHTML = hits.length ? hits.map(p => `
    <li><a href="#${p.slug}"${dirAttr(p)}>
      <span class="meta" dir="ltr">${fmt(p.date)} · ${p.minutes} min read</span>
      <span class="t">${esc(p.title)}</span>
      <span class="s">${esc(p.summary)}</span>
    </a></li>`).join("") : `<li><p class="meta" style="padding-block:20px">No article matches “${esc(query)}”.</p></li>`;
}

function article(i) {
  const p = POSTS[i], newer = POSTS[i - 1], older = POSTS[i + 1];
  document.title = p.title + " · Maḥw al-Rusūm";
  view.innerHTML = `
    <a class="back" href="#home">← All articles</a>
    <article${dirAttr(p)}>
      <header><h1>${esc(p.title)}</h1><p class="meta" dir="ltr">${fmt(p.date)} · ${p.minutes} min read</p></header>
      <div class="body">${p.html}</div>
    </article>
    <nav class="pager">
      ${older ? `<a href="#${older.slug}"><span class="lbl">← Older</span><span>${esc(older.title)}</span></a>` : ""}
      ${newer ? `<a class="next" href="#${newer.slug}"><span class="lbl">Newer →</span><span>${esc(newer.title)}</span></a>` : ""}
    </nav>`;
  window.scrollTo(0, 0);
}

function route() {
  const h = location.hash.slice(1);
  const i = POSTS.findIndex(p => p.slug === h);
  i >= 0 ? article(i) : home();
}
window.addEventListener("hashchange", route);
route();
</script>
